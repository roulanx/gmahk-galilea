    function renderEntity(){const data=state.entityData,canEdit=state.boot.user.permissions.edit;let records=data.records||[];const query=state.search.toLowerCase();if(query)records=records.filter(r=>JSON.stringify(r).toLowerCase().includes(query));if(state.status!=='ALL')records=records.filter(r=>String(r.status).toUpperCase()===state.status);const canAdd=canEdit&&data.entity!=='settings';$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>'+esc(data.label)+'</h1><p>Perubahan disimpan sebagai draft dan baru tampil di website setelah disetujui.</p></div>'+(canAdd?'<button class="btn primary" data-new-record>'+icon('plus')+'Tambah '+esc(data.label)+'</button>':'')+'</div>'+workflowHtml(data.workflows||[])+'<div class="toolbar"><label class="search">'+icon('search')+'<input id="entity-search" placeholder="Cari '+attr(data.label.toLowerCase())+'…" value="'+attr(state.search)+'"></label><div class="filters"><select id="entity-status"><option value="ALL" '+(state.status==='ALL'?'selected':'')+'>Semua status</option><option value="PUBLISH" '+(state.status==='PUBLISH'?'selected':'')+'>Published</option><option value="DRAFT" '+(state.status==='DRAFT'?'selected':'')+'>Draft</option></select><button class="icon-btn" data-reload title="Muat ulang">'+icon('refresh')+'</button></div></div><div class="record-grid">'+(records.length?records.map(recordHtml).join(''):emptyHtml('Belum ada konten yang sesuai.'))+'</div>'}
    function recordHtml(record){const isSchedule=state.entity==='schedule',isSetting=state.entity==='settings';const values=isSchedule?(record.fields||{}):(record.values||{});const pieces=Object.keys(values).map(k=>values[k]).filter(value=>value&&typeof value!=='object');const summary=isSchedule?[record.dateLabel,record.time?record.time+' WITA':''].concat(pieces.slice(0,3)).filter(Boolean).join(' · '):isSetting?String(values.value||'Belum diisi.'):pieces.slice(1,4).join(' · ');const canDelete=state.boot.user.permissions.edit&&!isSetting;return '<article class="card record"><div class="record-top">'+status(record.status||(isSchedule?'PUBLISH':'DRAFT'))+'<span class="small faint">'+esc(record.group||record.sectionTitle||'')+'</span></div><h3>'+esc(record.title||'Tanpa judul')+'</h3><p class="record-summary">'+esc(summary||'Belum ada keterangan.')+'</p><div class="record-actions">'+(state.boot.user.permissions.edit?'<button class="btn" data-edit-record="'+attr(record.id)+'">'+icon('edit')+'Edit</button>'+(canDelete?'<button class="btn danger" data-delete-record="'+attr(record.id)+'">'+icon('trash')+'</button>':''):'')+'</div></article>'}
    function workflowGuide(active){const steps=[['DRAFT','1. Draft','Isi dan periksa'],['PENDING','2. Diajukan','Menunggu reviewer'],['REVIEW','3. Ditinjau','Setujui atau revisi'],['PUBLISH','4. Terbit','Tampil di website']];const rank={DRAFT:0,REJECTED:0,PENDING:1,REVIEW:2,APPROVED:3,PUBLISH:3};const current=rank[active]??0;return '<div class="workflow-guide">'+steps.map((step,index)=>'<div class="workflow-step '+(index===current?'active':index<current?'done':'')+'"><b>'+step[1]+'</b><span>'+step[2]+'</span></div>').join('')+'</div>'}
    function workflowHtml(items){if(!items.length)return'';return '<div class="workflow-strip">'+items.map(w=>{const canManage=w.ownerEmail===state.boot.user.email||state.boot.user.role==='SUPERADMIN';const canApprove=state.boot.user.permissions.approve;let actions='';if(w.state==='PENDING'){if(canApprove)actions+='<button class="btn primary" data-open-review="'+attr(w.id)+'">'+icon('check')+'Tinjau</button>';if(canManage)actions+='<button class="btn" data-cancel-workflow="'+attr(w.id)+'">Tarik kembali</button>';if(!actions)actions='<span class="small faint">Menunggu reviewer</span>'}else if(canManage){if(w.action==='DELETE')actions+='<button class="btn primary" data-resubmit-workflow="'+attr(w.id)+'">'+icon('send')+'Ajukan hapus lagi</button>';else actions+='<button class="btn" data-edit-workflow="'+attr(w.id)+'">'+icon('edit')+(w.state==='REJECTED'?'Perbaiki revisi':'Lanjutkan draft')+'</button>';actions+='<button class="icon-btn" data-delete-workflow="'+attr(w.id)+'" aria-label="Hapus draft">'+icon('trash')+'</button>'}else actions='<span class="small faint">Dikelola oleh '+esc(w.ownerName)+'</span>';return '<div class="workflow-item">'+status(w.state)+'<div class="workflow-copy"><strong>'+esc(friendlyEntity(w.entity))+' · '+esc(w.action==='DELETE'?'HAPUS':'UBAH / TAMBAH')+'</strong><span>'+esc(w.ownerName)+' · '+esc(w.updatedAt)+'</span>'+(w.note?'<span class="workflow-note">Catatan: '+esc(w.note)+'</span>':'')+'</div><div class="button-row">'+actions+'</div></div>'}).join('')+'</div>'}

    function openNewRecord(){if(state.entity==='schedule'){if(!state.entityData.sections||!state.entityData.sections.length)return toast('Struktur bagian jadwal belum ditemukan. Periksa judul dan baris Tanggal pada spreadsheet.');return openScheduleEditor(null)}openGenericEditor(null,null)}

    function openGenericEditor(record,workflow){const data=state.entityData;state.currentEdit={entity:data.entity,entityId:record&&record.id||'',workflowId:workflow&&workflow.id||'',action:workflow&&workflow.action||'UPSERT'};$('#editor-title').textContent=(record?'Edit ':'Tambah ')+data.label;$('#editor-subtitle').textContent=workflow?(workflow.state==='REJECTED'?'Perbaiki catatan reviewer lalu ajukan kembali.':'Lanjutkan draft sebelum diajukan.'):'Perubahan baru akan masuk alur persetujuan.';$('#editor-workflow').innerHTML=workflowGuide(workflow&&workflow.state||'DRAFT');$('#editor-fields').innerHTML=data.fields.map(field=>{const configured=Object.assign({},field);if(data.entity==='settings'&&record&&record.values)configured.help=record.values.help;return fieldHtml(configured,record&&record.values?record.values[field.key]:'')}).join('');$('#editor-preview').classList.remove('show');$('#editor-preview').innerHTML='';$('#editor-dialog').showModal()}

    function fieldHtml(field,value){
      const full=['textarea','image','images','url'].includes(field.type)?' full':'';
      let control;
      if(field.type==='textarea') control='<textarea name="'+attr(field.key)+'" placeholder="'+attr(field.help||'Ketik isi di sini…')+'" '+(field.required?'required':'')+'>'+esc(value)+'</textarea>';

    function openScheduleEditor(record,workflow){const data=state.entityData;if(!data.sections||!data.sections.length)return toast('Bagian jadwal belum ditemukan pada spreadsheet.');const sectionId=record&&((record.values&&record.values.sectionId)||record.sectionId)||data.sections[0].id||'';const section=data.sections.find(s=>s.id===sectionId)||data.sections[0];const values=record&&record.values||record||{};const fields=values.fields||{};const locked=Boolean(record&&record.id&&!/^NEW-/i.test(record.id));state.currentEdit={entity:'schedule',entityId:record&&record.id||'',workflowId:workflow&&workflow.id||'',action:workflow&&workflow.action||'UPSERT'};$('#editor-title').textContent=record?'Edit Jadwal':'Tambah Jadwal';$('#editor-subtitle').textContent=data.sheetName+(locked?' · Jenis ibadah dikunci untuk menjaga struktur sheet':'');$('#editor-workflow').innerHTML=workflowGuide(workflow&&workflow.state||'DRAFT');const sectionControl='<select '+(locked?'disabled':'name="sectionId"')+' id="schedule-section">'+data.sections.map(s=>'<option value="'+s.id+'" '+(s.id===section.id?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select>'+(locked?'<input type="hidden" name="sectionId" value="'+attr(section.id)+'">':'');$('#editor-fields').innerHTML='<div class="field"><label>Jenis Ibadah *</label>'+sectionControl+'</div><div class="field"><label>Tanggal *</label><input type="date" name="isoDate" value="'+attr(values.isoDate||'')+'" required></div><div class="field full" id="schedule-fields">'+scheduleFieldsHtml(section,fields)+'</div>';$('#editor-dialog').showModal()}

    async function saveEditor(event){event.preventDefault();const button=event.submitter,intent=button&&button.value||'draft',form=event.currentTarget;if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form).entries());let payload;if(state.currentEdit.entity==='schedule'){payload={sectionId:data.sectionId,isoDate:data.isoDate,fields:{}};Object.keys(data).filter(k=>k.startsWith('schedule:')).forEach(k=>payload.fields[k.slice(9)]=data[k])}else{payload={};(state.entityData.fields||[]).forEach(f=>payload[f.key]=data[f.key]||'')}const buttons=$$('button[type="submit"]',form);buttons.forEach(b=>b.disabled=true);setBusy(button,true);try{const result=await server('adminSaveWorkflow',[{entity:state.currentEdit.entity,entityId:state.currentEdit.entityId,workflowId:state.currentEdit.workflowId,action:state.currentEdit.action,payload:payload,submit:intent==='submit'}]);$('#editor-dialog').close();toast(result.message);await loadEntity(state.entity)}catch(error){toast(cleanError(error.message))}finally{buttons.forEach(b=>b.disabled=false);setBusy(button,false)}}

    async function cancelWorkflow(id){if(!confirm('Tarik pengajuan ini kembali menjadi draft?'))return;try{const result=await server('adminCancelWorkflow',[id]);toast(result.message);if(state.boot&&state.boot.dashboard)state.boot.dashboard.myDrafts=Number(state.boot.dashboard.myDrafts||0)+1;await loadEntity(state.entity)}catch(error){toast(cleanError(error.message))}}

    async function uploadImage(input){
      const files=Array.from(input.files||[]);if(!files.length)return;
      if(files.length>12)return toast('Maksimal 12 foto dalam satu unggahan.');
      if(files.some(file=>file.size>4*1024*1024))return toast('Setiap gambar maksimal 4 MB.');
      const target=input.dataset.imageTarget,append=input.dataset.imageMode==='append';
      const field=$('[name="'+CSS.escape(target)+'"]',$('#editor-form'));
      const uploaded=[];
      try{
        for(let index=0;index<files.length;index++){
          const file=files[index];toast('Mengunggah foto '+(index+1)+' dari '+files.length+'…');
          const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
          const result=await server('adminUploadImage',[{name:file.name,mimeType:file.type,base64:base64}],30000);
          if(result&&result.url)uploaded.push(result.url);
        }
        if(field&&uploaded.length){
          const existing=append?String(field.value||'').split(/\n+/).map(value=>value.trim()).filter(Boolean):[];
          field.value=existing.concat(uploaded).slice(0,12).join('\n');
          field.dispatchEvent(new Event('change',{bubbles:true}));
        }
        toast(uploaded.length+' foto berhasil ditambahkan.');
      }catch(error){toast(cleanError(error.message))}finally{input.value=''}
    }

    async function loadApprovals(filter,force){if(filter)state.approvalStatus=filter;const cached=state.approvalCache[state.approvalStatus];state.approvals=!force&&cached&&Date.now()-cached.time<60000?cached.items:await server('adminListApprovals',[state.approvalStatus],10000);state.approvalCache[state.approvalStatus]={time:Date.now(),items:state.approvals};const items=state.approvals,labels={PENDING:'Menunggu',APPROVED:'Diterbitkan',REJECTED:'Perlu revisi'};$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">ALUR PUBLIKASI</span><h1>Persetujuan Konten</h1><p>Tinjau perubahan dengan cepat. Alasan revisi akan dikirim kembali kepada editor.</p></div><span class="status '+state.approvalStatus.toLowerCase()+'">'+esc(items.length)+' '+esc(labels[state.approvalStatus]||state.approvalStatus)+'</span></div><div class="approval-tabs">'+['PENDING','APPROVED','REJECTED'].map(key=>'<button class="approval-tab '+(state.approvalStatus===key?'active':'')+'" data-approval-status="'+key+'">'+esc(labels[key])+'</button>').join('')+'</div><div class="approval-list">'+(items.length?items.map(approvalHtml).join(''):emptyHtml('Belum ada item pada status ini.'))+'</div>'}
    function approvalHtml(item){const action=item.state==='PENDING'?'<button class="btn primary" data-open-review="'+attr(item.id)+'">Tinjau sekarang '+icon('check')+'</button>':'<span class="small faint">'+esc(item.reviewerEmail?(item.reviewerEmail+' · '+item.reviewedAt):'Belum ada reviewer')+'</span>';return '<article class="card approval-card"><div><div class="approval-meta">'+status(item.state)+'<span>'+esc(friendlyEntity(item.entity))+'</span><span>'+esc(item.ownerName)+'</span><span>'+esc(item.updatedAt)+'</span></div><h3 style="margin-top:16px">'+esc(item.action==='DELETE'?'Penghapusan konten':'Perubahan '+friendlyEntity(item.entity))+'</h3>'+payloadHtml(item.payload)+(item.note?'<p class="workflow-note">Catatan reviewer: '+esc(item.note)+'</p>':'')+'</div><div class="button-row">'+action+'</div></article>'}
    function payloadHtml(payload){const entries=Object.keys(payload||{});if(!entries.length)return'<div class="payload"><div><small>Perubahan</small><strong>Konten akan dihapus setelah disetujui.</strong></div></div>';return '<div class="payload">'+entries.map(key=>{const value=payload[key];if(value&&typeof value==='object')return'<div class="payload-wide"><small>'+esc(key)+'</small><strong>'+Object.keys(value).map(child=>esc(child)+': '+esc(value[child])).join('<br>')+'</strong></div>';return'<div><small>'+esc(key)+'</small><strong>'+esc(value)+'</strong></div>'}).join('')+'</div>'}
    function openReview(id){const item=(state.approvals||[]).find(x=>x.id===id);if(!item)return toast('Pengajuan ini sudah diproses. Muat ulang daftar.');state.currentReview=item;state.reviewMode='';$('#review-caption').textContent='Periksa isi sebelum mengambil keputusan';$('#review-body').innerHTML=workflowGuide('REVIEW')+'<div class="approval-meta">'+status(item.state)+'<span>'+esc(friendlyEntity(item.entity))+'</span><span>'+esc(item.ownerName)+'</span></div><h2 class="review-title">'+esc(item.action==='DELETE'?'Konfirmasi penghapusan':'Periksa sebelum diterbitkan')+'</h2>'+payloadHtml(item.payload)+'<section class="review-reason" id="review-reason" aria-hidden="true"><div class="reason-head">'+icon('edit')+'<div><strong>Alasan revisi</strong><span>Jelaskan bagian yang harus diperbaiki. Catatan ini langsung terlihat oleh editor.</span></div></div><textarea id="review-note" minlength="4" placeholder="Contoh: Perbaiki tanggal kegiatan dan tambahkan lokasi yang lengkap."></textarea><span class="reason-help" id="reason-help">Minimal 4 karakter.</span></section>';const reject=$('[data-review="REJECT"]');reject.innerHTML='Minta revisi';reject.classList.remove('primary');reject.classList.add('danger');$('#review-dialog').showModal()}
    async function review(decision){if(!state.currentReview)return;const reason=$('#review-reason'),note=$('#review-note')?$('#review-note').value.trim():'';if(decision==='REJECT'&&state.reviewMode!=='reject'){state.reviewMode='reject';reason.classList.add('show');reason.setAttribute('aria-hidden','false');$('#review-caption').textContent='Tuliskan alasan revisi sebelum dikirim';const reject=$('[data-review="REJECT"]');reject.innerHTML=icon('send')+'Kirim untuk revisi';reject.classList.remove('danger');reject.classList.add('primary');requestAnimationFrame(()=>{$('#review-note').focus();reason.scrollIntoView({behavior:'smooth',block:'nearest'})});return}if(decision==='REJECT'&&note.length<4){$('#review-note').focus();$('#reason-help').classList.add('error');return}const buttons=$$('[data-review]'),button=$('[data-review="'+decision+'"]'),reviewed=state.currentReview;buttons.forEach(b=>b.disabled=true);setBusy(button,true,decision==='REJECT'?'Mengirim revisi…':'Menerbitkan…');try{const result=await server('adminReviewWorkflow',[reviewed.id,decision,note],12000);$('#review-dialog').close();toast(result.message);if(state.boot&&state.boot.dashboard)state.boot.dashboard.pendingApprovals=Math.max(0,Number(state.boot.dashboard.pendingApprovals||0)-1);state.approvalCache.PENDING={time:Date.now(),items:(state.approvalCache.PENDING&&state.approvalCache.PENDING.items||state.approvals).filter(item=>item.id!==reviewed.id)};const target=decision==='APPROVE'?'APPROVED':'REJECTED';const moved=Object.assign({},reviewed,{state:result.state,note:note,reviewerEmail:state.boot.user.email,reviewedAt:'Baru saja'});const existing=state.approvalCache[target]&&state.approvalCache[target].items||[];state.approvalCache[target]={time:Date.now(),items:[moved].concat(existing.filter(item=>item.id!==moved.id))};state.currentReview=null;state.reviewMode='';await loadApprovals(target,false)}catch(error){toast(cleanError(error.message))}finally{buttons.forEach(b=>b.disabled=false);setBusy(button,false)}}

    async function loadServices(){state.services=await server('adminListServices',[]);renderServices()}
    function renderServices(){const query=state.search.toLowerCase();const items=state.services.filter(item=>(state.status==='ALL'||item.status===state.status)&&(!query||JSON.stringify(item).toLowerCase().includes(query)));$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">PELAYANAN PRIVAT</span><h1>Layanan Jemaat</h1><p>Permohonan doa, kunjungan, kelas Alkitab, baptisan, dan kebutuhan jemaat.</p></div></div><div class="toolbar"><label class="search">'+icon('search')+'<input id="service-search" placeholder="Cari nama atau jenis layanan…" value="'+attr(state.search)+'"></label><div class="filters"><select id="service-status"><option value="ALL" '+(state.status==='ALL'?'selected':'')+'>Semua status</option>'+['BARU','DIPROSES','MENUNGGU','SELESAI','DITUTUP'].map(s=>'<option '+(state.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div class="service-list">'+(items.length?items.map(serviceHtml).join(''):emptyHtml('Tidak ada permohonan yang sesuai.'))+'</div>'}
    function serviceHtml(item){return '<article class="card service-card '+(item.restricted?'restricted':'')+'"><div><div class="service-meta">'+status(item.status)+'<span>'+esc(item.receivedAt)+'</span><span>'+esc(item.type)+'</span><span class="privacy-chip">'+esc(privacyLabel(item.privacy))+'</span></div><h3 style="margin-top:15px">'+esc(item.name)+'</h3><p class="muted">'+esc(item.message)+'</p><span class="small faint">'+esc(item.phone)+(item.updatedAt?' · diperbarui '+esc(item.updatedAt):'')+'</span></div><div class="button-row">'+(!item.restricted&&item.phone?'<a class="btn soft" href="'+attr(serviceWhatsAppUrl(item))+'" target="_blank" rel="noopener">WhatsApp</a>':'')+(!item.restricted&&item.privacy==='ANONIM'?'<button class="btn" data-share-prayer="'+attr(item.id)+'">Bagikan anonim</button>':'')+'<button class="btn" data-open-service="'+attr(item.id)+'">'+(item.restricted?'Lihat batas akses':'Tindak lanjuti')+'</button></div></article>'}
    function privacyLabel(value){return({GEMBALA:'Gembala saja',TIM_PELAYANAN:'Tim pelayanan',ANONIM:'Boleh dibagikan anonim'})[value]||'Tim pelayanan'}
    function sharePrayer(id){const item=state.services.find(entry=>entry.id===id);if(!item||item.restricted)return;const text='Permohonan doa anonim\n\n'+item.message+'\n\nMohon dukungan doa dari Jemaat Galilea.';window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}
    function serviceWhatsAppUrl(item){const phone=String(item.phone||'').replace(/\D/g,'').replace(/^0/,'62');return'https://wa.me/'+phone+'?text='+encodeURIComponent('Shalom '+(item.name||'')+', kami dari GMAHK Galilea menindaklanjuti permohonan '+(item.type||'pelayanan')+'.')}
    function openService(id){const item=state.services.find(x=>x.id===id);if(!item)return;state.currentService=item;if(item.restricted){$('#service-body').innerHTML='<span class="eyebrow">AKSES TERBATAS</span><h2>Permohonan untuk Gembala</h2><p class="muted">Isi, identitas, dan kontak disembunyikan untuk menjaga pilihan privasi jemaat. APPROVER atau SUPERADMIN dapat menindaklanjuti.</p>';$('#save-service').hidden=true;return $('#service-dialog').showModal()}$('#save-service').hidden=false;$('#service-body').innerHTML='<span class="eyebrow">'+esc(item.type)+'</span><h2>'+esc(item.name)+'</h2><p class="muted">'+esc(item.message)+'</p><p><span class="privacy-chip">'+esc(privacyLabel(item.privacy))+'</span></p><div class="grid grid-2"><div class="field"><label>WhatsApp</label><input value="'+attr(item.phone)+'" readonly></div><div class="field"><label>Status</label><select id="service-edit-status">'+['BARU','DIPROSES','MENUNGGU','SELESAI','DITUTUP'].map(s=>'<option '+(item.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div class="field" style="margin-top:17px"><label>Catatan internal</label><textarea id="service-note">'+esc(item.adminNote||'')+'</textarea></div>';$('#service-dialog').showModal()}
    async function saveService(){if(!state.currentService)return;const button=$('#save-service');setBusy(button,true);try{await server('adminUpdateServiceStatus',[state.currentService.id,$('#service-edit-status').value,$('#service-note').value]);$('#service-dialog').close();toast('Status layanan diperbarui.');await loadServices()}catch(error){toast(cleanError(error.message))}finally{setBusy(button,false)}}

    async function loadUsers(){state.users=await server('adminListUsers',[]);$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">KONTROL AKSES</span><h1>Pengelola Portal</h1><p>Atur akun Google dan batas kewenangan setiap pengurus.</p></div><button class="btn primary" data-new-user>'+icon('plus')+'Tambah Pengelola</button></div><div class="role-grid">'+roleCard('VIEWER','Melihat data tanpa mengubah.')+roleCard('EDITOR','Membuat draft dan mengelola layanan.')+roleCard('APPROVER','Meninjau serta menerbitkan konten.')+roleCard('SUPERADMIN','Kontrol penuh termasuk akun dan backup.')+'</div><div class="user-list">'+(state.users.length?state.users.map(userHtml).join(''):emptyHtml('Belum ada pengelola portal.'))+'</div>'}
    function roleCard(role,copy){return'<article class="role-card"><strong>'+esc(role)+'</strong><span>'+esc(copy)+'</span></article>'}
    function userHtml(user){return '<article class="card user-card"><div class="user-row"><span class="avatar">'+esc(initials(user.name))+'</span><div><strong>'+esc(user.name)+'</strong><span class="muted small">'+esc(user.email)+' · '+esc(user.role)+' · '+esc(user.status)+'</span></div></div><div class="button-row"><button class="btn" data-edit-user="'+attr(user.id)+'">'+icon('edit')+'Edit</button><button class="btn danger" data-delete-user="'+attr(user.id)+'">'+icon('trash')+'</button></div></article>'}
    function openUser(id){const user=state.users.find(x=>x.id===id)||{id:'',name:'',email:'',role:'VIEWER',status:'AKTIF'};const form=$('#user-form');form.reset();Object.keys(user).forEach(key=>{if(form.elements[key])form.elements[key].value=user[key]});$('#user-dialog').showModal()}
    async function saveUser(event){event.preventDefault();const button=event.submitter,set=Object.fromEntries(new FormData(event.currentTarget).entries());setBusy(button,true);try{const result=await server('adminSaveUser',[set]);$('#user-dialog').close();toast(result.message||'Data pengelola disimpan.');await loadUsers()}catch(error){toast(cleanError(error.message))}finally{setBusy(button,false)}}
    async function deleteUser(id){if(!confirm('Hapus pengelola ini dari portal?'))return;try{await server('adminDeleteUser',[id]);toast('Pengelola dihapus.');await loadUsers()}catch(error){toast(cleanError(error.message))}}

    function renderSystem(){const canBackup=state.boot.user.permissions.backup;$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">SYSTEM OPERATIONS</span><h1>Sistem, arsip & backup</h1><p>Perawatan website dilakukan tanpa mengubah isi sumber API.</p></div><span class="status publish">V'+esc(state.boot.version)+'</span></div><div class="grid grid-4"><article class="card card-pad"><span class="metric-icon">'+icon('refresh')+'</span><h3 style="margin-top:24px">Perbarui Cache</h3><p class="muted">Paksa viewer membaca perubahan spreadsheet terbaru.</p><button class="btn primary" data-system="refresh">Jalankan sekarang</button></article><article class="card card-pad"><span class="metric-icon">'+icon('check')+'</span><h3 style="margin-top:24px">Pemeriksaan Sumber</h3><p class="muted">Periksa materi, video, Alkitab, dan layanan.</p><button class="btn" data-system="health">Periksa sistem</button></article><article class="card card-pad"><span class="metric-icon">'+icon('download')+'</span><h3 style="margin-top:24px">Arsip PDF Publik</h3><p class="muted">Bangun ulang PDF Alkitab dan Lagu Sion lengkap untuk viewer.</p><button class="btn" data-system="archives" '+(canBackup?'':'disabled')+'>Bangun arsip</button></article><article class="card card-pad"><span class="metric-icon">'+icon('download')+'</span><h3 style="margin-top:24px">Backup Data</h3><p class="muted">Buat salinan spreadsheet dan layanan jemaat di Drive.</p><button class="btn" data-system="backup" '+(canBackup?'':'disabled')+'>Buat backup</button></article></div><div id="system-result" style="margin-top:20px"></div><article class="card card-pad" style="margin-top:22px"><span class="eyebrow">KEAMANAN DEPLOYMENT</span><h3>Portal admin memakai deployment khusus.</h3><p class="muted">Buka alamat Vercel <strong>/admin</strong>. Vercel akan meneruskan Anda ke deployment admin yang berjalan sebagai <strong>User accessing the web app</strong> sehingga email Google dapat diverifikasi.</p></article>'}
    async function runSystem(action,button){const label=action==='backup'?'Membuat backup…':action==='archives'?'Menyusun PDF lengkap…':'Memproses…';setBusy(button,true,label);try{const result=await server('adminRunSystemAction',[action],action==='archives'?110000:22000);$('#system-result').innerHTML='<article class="card card-pad"><span class="status approved">BERHASIL</span><pre style="white-space:pre-wrap;color:var(--soft);overflow-wrap:anywhere">'+esc(typeof result==='string'?result:JSON.stringify(result,null,2))+'</pre></article>';toast(action==='archives'?'Arsip PDF siap digunakan di viewer.':'Aksi sistem selesai.')}catch(error){$('#system-result').innerHTML=errorBox(error.message)}finally{setBusy(button,false)}}

    function emptyHtml(message){return '<div class="empty">'+icon('info')+'<p>'+esc(message)+'</p></div>'}
    async function refreshBootstrap(){state.boot=await server('adminGetBootstrap',[]);$('#root').innerHTML=shell();bindShell();applyTheme(currentTheme());$$('.nav-item').forEach(button=>button.classList.toggle('active',button.dataset.route===state.route));const crumb=$('#crumb-title');if(crumb)crumb.textContent=routeTitle()}
    function showGate(error){
      const raw=String(error&&error.message||'Terjadi gangguan saat membuka portal.');
      const access=/^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/.test(raw);
      const message=cleanError(raw);
      const title=access?'Akses admin diperlukan.':'Portal belum dapat dimuat.';
      const eyebrow=access?'VERIFIKASI AKUN':'PEMULIHAN SISTEM';
      const steps=access
        ? '<div class="step"><b>1</b><span>Gunakan deployment admin yang dijalankan sebagai <strong>User accessing the web app</strong>.</span></div><div class="step"><b>2</b><span>Pastikan email Google tercantum dan berstatus <strong>AKTIF</strong> pada sheet <strong>Website Admin</strong>.</span></div><div class="step"><b>3</b><span>Buka alamat Vercel dengan akhiran <strong>/admin</strong>, lalu masuk memakai akun tersebut.</span></div>'
        : '<div class="step"><b>1</b><span>Akun Google Anda sudah dikenali; ini adalah gangguan kode atau data, bukan masalah login.</span></div><div class="step"><b>2</b><span>Pastikan deployment admin memakai versi terbaru, bukan versi lama.</span></div><div class="step"><b>3</b><span>Muat ulang setelah deployment selesai diperbarui.</span></div>';
      $('#loader').classList.add('hidden');
      $('#root').innerHTML='<main class="gate"><article class="gate-card">'+logoMark('gate-logo')+'<span class="eyebrow">'+eyebrow+'</span><h1>'+title+'</h1><p class="muted gate-message">'+esc(message)+'</p><div class="steps">'+steps+'</div><button class="btn primary" onclick="location.reload()">Muat ulang portal</button></article></main>';
    }
    function bindShell(){
      $('#mobile-menu')?.addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open')});$('#overlay')?.addEventListener('click',closeSidebar);$('#theme-toggle')?.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
    }
    document.addEventListener('click',event=>{const route=event.target.closest('[data-route]');if(route)return navigate(route.dataset.route);const close=event.target.closest('[data-close]');if(close)return $('#'+close.dataset.close).close();if(event.target.closest('[data-preview-editor]'))return previewEditor();if(event.target.closest('[data-new-record]'))return openNewRecord();const edit=event.target.closest('[data-edit-record]');if(edit)return openRecord(edit.dataset.editRecord);const del=event.target.closest('[data-delete-record]');if(del)return requestDelete(del.dataset.deleteRecord);const ew=event.target.closest('[data-edit-workflow]');if(ew)return openWorkflow(ew.dataset.editWorkflow);const rw=event.target.closest('[data-resubmit-workflow]');if(rw)return resubmitWorkflow(rw.dataset.resubmitWorkflow);const cw=event.target.closest('[data-cancel-workflow]');if(cw)return cancelWorkflow(cw.dataset.cancelWorkflow);const dw=event.target.closest('[data-delete-workflow]');if(dw){if(!confirm('Hapus draft ini secara permanen?'))return;return server('adminDeleteWorkflow',[dw.dataset.deleteWorkflow]).then(()=>{toast('Draft dihapus.');loadEntity(state.entity)}).catch(e=>toast(cleanError(e.message)))}if(event.target.closest('[data-reload]')||event.target.closest('[data-retry]'))return renderRoute();const approvalTab=event.target.closest('[data-approval-status]');if(approvalTab)return loadApprovals(approvalTab.dataset.approvalStatus);const reviewButton=event.target.closest('[data-open-review]');if(reviewButton)return openReview(reviewButton.dataset.openReview);const reviewAction=event.target.closest('[data-review]');if(reviewAction)return review(reviewAction.dataset.review);const service=event.target.closest('[data-open-service]');if(service)return openService(service.dataset.openService);const sharePrayerButton=event.target.closest('[data-share-prayer]');if(sharePrayerButton)return sharePrayer(sharePrayerButton.dataset.sharePrayer);if(event.target.closest('[data-new-user]'))return openUser('');const eu=event.target.closest('[data-edit-user]');if(eu)return openUser(eu.dataset.editUser);const du=event.target.closest('[data-delete-user]');if(du)return deleteUser(du.dataset.deleteUser);const sys=event.target.closest('[data-system]');if(sys)return runSystem(sys.dataset.system,sys)});
    function queueSearch(render,inputId){clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>{render();requestAnimationFrame(()=>{const input=$('#'+inputId);if(!input)return;input.focus();const end=input.value.length;input.setSelectionRange(end,end)})},180)}
    document.addEventListener('input',event=>{if(event.target.id==='entity-search'){state.search=event.target.value;queueSearch(renderEntity,'entity-search')}if(event.target.id==='service-search'){state.search=event.target.value;queueSearch(renderServices,'service-search')}});
    document.addEventListener('change',event=>{if(event.target.id==='entity-status'){state.status=event.target.value;renderEntity()}if(event.target.id==='service-status'){state.status=event.target.value;renderServices()}if(event.target.matches('.image-file'))uploadImage(event.target);if(event.target.id==='schedule-section'){const section=state.entityData.sections.find(s=>s.id===event.target.value);$('#schedule-fields').innerHTML=scheduleFieldsHtml(section,{})}});
    $('#editor-form').addEventListener('submit',saveEditor);$('#user-form').addEventListener('submit',saveUser);$('#save-service').addEventListener('click',saveService);
    window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(route&&route!==state.route)navigate(route)});
    async function boot(){applyTheme(currentTheme());try{state.boot=await server('adminGetBootstrap',[]);$('#root').innerHTML=shell();bindShell();const route=location.hash.slice(1)||'dashboard';navigate(route);$('#loader').classList.add('hidden')}catch(error){showGate(error)}}
    boot();
  })();
  </script>
