<!doctype html>
<html lang="id" data-theme="light" data-build="GALILEA-ADMIN-PRO-35-6-0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#eef0e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07110c" media="(prefers-color-scheme: dark)">
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       GMAHK GALILEA ADMIN CONTROL SUITE — MODERN PREMIUM OVERHAUL v40.0
       Modern · Elegant · Premium · Clean · Calm · Intuitive
       ═══════════════════════════════════════════════════════════════════════ */

    :root {
      /* Surface system — organic sanctuary tones */
      --bg: #f2f5ee;
      --surface: #fbfcfa;
      --surface-2: #e7ede2;
      --surface-3: #dae4d4;
      --surface-translucent: rgba(251, 252, 250, 0.88);

      /* Typography colors */
      --text: #0e1912;
      --soft: #425648;
      --faint: #677c6e;

      /* Lines & dividers */
      --line: #c7d5c3;
      --line-subtle: rgba(199, 213, 195, 0.5);

      /* Brand palette — Galilea forest sanctuary */
      --brand: #225137;
      --brand-hover: #1b422d;
      --brand-2: #5b8764;
      --brand-soft: #d5e6d2;
      --gold: #aa8642;
      --gold-soft: #f4ecd8;

      /* Semantic status indicators */
      --danger: #b6373e;
      --danger-soft: #fbe9ea;
      --warning: #9e6714;
      --warning-soft: #fdf3de;
      --success: #276f43;
      --success-soft: #d8eedf;

      /* Shadows & elevation */
      --shadow-xs: 0 1px 3px rgba(18, 42, 26, 0.05);
      --shadow-sm: 0 4px 14px rgba(18, 42, 26, 0.06), 0 1px 3px rgba(18, 42, 26, 0.04);
      --shadow: 0 12px 34px rgba(18, 42, 26, 0.09), 0 3px 8px rgba(18, 42, 26, 0.04);
      --shadow-lg: 0 24px 70px rgba(14, 38, 22, 0.14), 0 8px 24px rgba(14, 38, 22, 0.06);

      /* Sizing & metrics */
      --sidebar: 276px;
      --topbar: 76px;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --admin-radius: 18px;
      --admin-gap: 18px;

      /* Motion */
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --dur: 0.24s;
    }

    [data-theme="dark"] {
      --bg: #07120c;
      --surface: #0f1d15;
      --surface-2: #16291e;
      --surface-3: #1e3627;
      --surface-translucent: rgba(15, 29, 21, 0.88);

      --text: #f3f8f1;
      --soft: #b8ccbe;
      --faint: #829a88;

      --line: #263d2e;
      --line-subtle: rgba(38, 61, 46, 0.6);

      --brand: #86c492;
      --brand-hover: #9ad4a5;
      --brand-2: #65986c;
      --brand-soft: #193824;
      --gold: #dcba72;
      --gold-soft: #2e2612;

      --danger: #ff858d;
      --danger-soft: #381216;
      --warning: #f1bf66;
      --warning-soft: #36280b;
      --success: #78ce8f;
      --success-soft: #12341d;

      --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.28), 0 1px 3px rgba(0, 0, 0, 0.18);
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.38), 0 3px 8px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.52), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    /* ── Reset & Foundation ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box }
    html, body { min-height: 100%; margin: 0; max-width: 100%; overflow-x: hidden }
    html { background: var(--bg); scroll-behavior: smooth; color-scheme: light }
    html[data-theme="dark"] { color-scheme: dark }

    body {
      min-width: 0;
      color: var(--text);
      background:
        radial-gradient(55rem 38rem at 0% -6%, color-mix(in srgb, var(--brand) 13%, transparent), transparent 74%),
        radial-gradient(40rem 30rem at 100% 12%, color-mix(in srgb, var(--gold) 8%, transparent), transparent 72%),
        var(--bg);
      font: 15px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.014em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-x: none;
    }

    button, input, select, textarea { font: inherit }
    button, a { color: inherit }
    button { cursor: pointer; border: 0; background: transparent }
    a { text-decoration: none }
    img { display: block; max-width: 100% }

    h1, h2, h3, p { margin-top: 0 }
    h1, h2, h3 { line-height: 1.05; letter-spacing: -0.048em; font-weight: 800 }
    h1 { font-size: clamp(2.3rem, 5.2vw, 4.8rem) }
    h2 { font-size: clamp(1.75rem, 3.5vw, 3.1rem) }
    h3 { font-size: 1.18rem }
    h1, h2, h3, p, strong, span, label, small, button, a, dd, dt, pre { overflow-wrap: anywhere }

    .muted { color: var(--soft) }
    .faint { color: var(--faint) }
    .small { font-size: 0.78rem }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* ── Icons ─────────────────────────────────────────────────────── */
    .icon {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
      transition: transform var(--dur) var(--ease);
    }

    /* ── Shell & Main Architecture ─────────────────────────────────── */
    .admin-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .admin-shell, .workspace, .content, .topbar, .sidebar, .page-head, .toolbar,
    .record-grid, .quick-grid, .grid, .card, .record, .metric, .quick-action,
    .workflow-item, .approval-card, .service-card, .user-card, .payload,
    .modal-head, .modal-body, .modal-foot, .form-grid, .field {
      min-width: 0;
      max-width: 100%;
    }

    /* ── Sidebar Navigation ────────────────────────────────────────── */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 70;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      border-right: 1px solid var(--line);
      background: var(--surface-translucent);
      backdrop-filter: blur(28px) saturate(160%);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.02);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 8px 8px 20px;
      border-bottom: 1px solid var(--line);
      transition: opacity var(--dur) var(--ease);
    }
    .brand:hover { opacity: 0.92 }

    .brand strong, .brand span {
      display: block;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .brand strong {
      font-size: 0.92rem;
      font-weight: 850;
      letter-spacing: -0.02em;
    }
    .brand span {
      margin-top: 2px;
      color: var(--faint);
      font-size: 0.65rem;
      font-weight: 550;
    }

    .nav-scroll {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 0 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .nav-label {
      margin: 18px 10px 7px;
      color: var(--faint);
      font-size: 0.62rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .nav-item {
      position: relative;
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 13px;
      border-radius: 12px;
      color: var(--soft);
      background: transparent;
      text-align: left;
      font-size: 0.79rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: all var(--dur) var(--ease);
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--surface-2);
      transform: translateX(2px);
    }

    .nav-item.active {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 34%, transparent);
    }
    [data-theme="dark"] .nav-item.active {
      color: #07120b;
      background: var(--brand);
      box-shadow: 0 6px 18px rgba(134, 196, 146, 0.28);
    }

    .nav-item .count {
      margin-left: auto;
      min-width: 22px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      border-radius: 999px;
      color: inherit;
      background: rgba(255, 255, 255, 0.2);
      font-size: 0.65rem;
      font-weight: 800;
    }
    [data-theme="light"] .nav-item:not(.active) .count {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .sidebar-user {
      margin-top: auto;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-2);
      transition: border-color var(--dur) var(--ease);
    }
    .sidebar-user:hover { border-color: var(--brand) }

    .user-row {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      font-weight: 850;
      font-size: 0.85rem;
      box-shadow: 0 3px 8px color-mix(in srgb, var(--brand) 28%, transparent);
    }

    .sidebar-user strong, .sidebar-user span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .sidebar-user strong { font-size: 0.78rem; font-weight: 800 }
    .sidebar-user span { color: var(--faint); font-size: 0.65rem }
    .sidebar-user .user-row > span:last-child { min-width: 0 }

    .build-badge {
      display: inline-flex !important;
      width: max-content;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--brand) !important;
      background: var(--brand-soft);
      font-size: 0.58rem !important;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    /* ── Topbar ────────────────────────────────────────────────────── */
    .workspace {
      min-width: 0;
      grid-column: 2;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 45;
      min-height: var(--topbar);
      height: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px clamp(18px, 3.5vw, 50px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(24px) saturate(160%);
    }

    .crumb strong, .crumb span { display: block }
    .crumb strong {
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .crumb span {
      color: var(--faint);
      font-size: 0.71rem;
      font-weight: 500;
    }
    .crumb { min-width: 0 }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .mobile-menu { display: none }
    .mobile-overlay { display: none }

    /* ── Content Layout ────────────────────────────────────────────── */
    .content {
      width: min(1420px, calc(100% - clamp(32px, 6vw, 88px)));
      margin: 0 auto;
      padding: clamp(34px, 4.6vw, 68px) 0 80px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
    }
    .page-head h1 {
      margin-bottom: 8px;
      max-width: 860px;
      font-size: clamp(2.35rem, 5vw, 4.8rem);
      line-height: 0.94;
      letter-spacing: -0.05em;
    }
    .page-head p {
      max-width: 720px;
      margin-bottom: 0;
      color: var(--soft);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      color: var(--brand);
      font-size: 0.64rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 22px;
      height: 1.5px;
      content: "";
      background: currentColor;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      margin: 40px 0 20px;
    }
    .section-head h2 {
      margin-bottom: 0;
      font-size: clamp(1.75rem, 3.2vw, 2.9rem);
    }

    /* ── Buttons & Interactive Controls ────────────────────────────── */
    .btn {
      position: relative;
      overflow: hidden;
      min-height: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 780;
      letter-spacing: -0.01em;
      transition: all var(--dur) var(--ease);
      box-shadow: var(--shadow-xs);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
    }

    .btn::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(105deg, transparent 28%, rgba(255, 255, 255, 0.22) 50%, transparent 72%);
      transform: translateX(-140%);
      transition: transform 0.65s var(--ease);
      pointer-events: none;
    }
    .btn:hover::after { transform: translateX(140%) }

    .btn.primary {
      color: #fff;
      border-color: transparent;
      background: var(--brand);
      box-shadow: 0 5px 16px color-mix(in srgb, var(--brand) 32%, transparent);
    }
    .btn.primary:hover {
      background: var(--brand-hover);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--brand) 42%, transparent);
    }
    [data-theme="dark"] .btn.primary {
      color: #07120b;
      background: var(--brand);
      box-shadow: 0 5px 16px rgba(134, 196, 146, 0.32);
    }
    [data-theme="dark"] .btn.primary:hover {
      background: var(--brand-hover);
      box-shadow: 0 8px 24px rgba(134, 196, 146, 0.44);
    }

    .btn.soft {
      color: var(--brand);
      border-color: transparent;
      background: var(--brand-soft);
      box-shadow: none;
    }
    .btn.soft:hover {
      background: color-mix(in srgb, var(--brand-soft) 85%, var(--brand));
    }

    .btn.danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 32%, var(--line));
      background: var(--danger-soft);
      box-shadow: none;
    }
    .btn.danger:hover {
      border-color: var(--danger);
      background: color-mix(in srgb, var(--danger-soft) 75%, var(--danger));
    }

    .btn:disabled {
      opacity: 0.52;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      min-width: 0;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--soft);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
      transition: all var(--dur) var(--ease);
    }
    .icon-btn:hover {
      color: var(--brand);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: var(--brand);
    }

    .btn, .icon-btn, .nav-item, input, select, textarea {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Grids & Responsive Structures ────────────────────────────── */
    .grid { display: grid; gap: 18px }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }

    /* ── Cards & Surfaces ──────────────────────────────────────────── */
    .card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      isolation: isolate;
      background: linear-gradient(155deg, var(--surface), color-mix(in srgb, var(--surface-2) 16%, var(--surface)));
      box-shadow: var(--shadow-sm);
      transition: all var(--dur) var(--ease);
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--brand) 38%, var(--line));
      box-shadow: var(--shadow);
    }
    .card-pad { padding: clamp(22px, 3.2vw, 32px) }

    /* ── Dashboard Hero Section ────────────────────────────────────── */
    .hero-admin {
      position: relative;
      overflow: hidden;
      min-height: 410px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(250px, 0.65fr);
      align-items: end;
      gap: 32px;
      padding: clamp(38px, 5.8vw, 76px);
      border-radius: 32px;
      color: #f4f8f1;
      background:
        radial-gradient(42rem 30rem at 92% 4%, rgba(218, 230, 207, 0.2), transparent 70%),
        radial-gradient(28rem 22rem at 64% 100%, rgba(210, 177, 111, 0.12), transparent 72%),
        linear-gradient(128deg, #05130a, #133924 60%, #466849);
      box-shadow: var(--shadow-lg);
      isolation: isolate;
    }

    .hero-admin::before {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black 20%, transparent 80%);
      pointer-events: none;
    }

    .hero-admin::after {
      position: absolute;
      right: -10rem;
      top: -15rem;
      width: 34rem;
      height: 34rem;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 4.5rem rgba(255, 255, 255, 0.025), 0 0 0 9.5rem rgba(255, 255, 255, 0.012);
      pointer-events: none;
    }

    .hero-admin > * { position: relative; z-index: 1 }

    .hero-admin h1 {
      max-width: 840px;
      margin-bottom: 14px;
      font-size: clamp(3rem, 6.2vw, 6.4rem);
      line-height: 0.88;
      letter-spacing: -0.065em;
    }

    .hero-admin p {
      max-width: 630px;
      color: rgba(244, 248, 241, 0.74);
      font-size: 1.02rem;
      line-height: 1.68;
    }

    .hero-status {
      align-self: end;
      display: grid;
      gap: 11px;
      padding: 24px;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
    }
    .hero-status div {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.73rem;
    }
    .hero-status strong {
      color: #fff;
      text-align: right;
      font-weight: 750;
    }

    /* ── Metrics Cards ─────────────────────────────────────────────── */
    .metric {
      min-height: 172px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      transition: all var(--dur) var(--ease);
    }
    .metric:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--brand) 42%, var(--line));
      box-shadow: var(--shadow);
    }
    .metric-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: var(--brand);
      background: var(--brand-soft);
    }
    .metric strong {
      display: block;
      margin-top: 22px;
      font-size: clamp(2.1rem, 4.2vw, 3.6rem);
      letter-spacing: -0.06em;
      font-weight: 850;
    }
    .metric span {
      color: var(--soft);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .metric.is-loading strong { color: var(--faint) }

    /* ── Quick Actions Grid ────────────────────────────────────────── */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .quick-action {
      min-height: 154px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      color: var(--text);
      background: var(--surface);
      text-align: left;
      transition: all var(--dur) var(--ease);
      isolation: isolate;
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }
    .quick-action:hover {
      border-color: color-mix(in srgb, var(--brand) 44%, var(--line));
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }
    .quick-action .icon {
      color: var(--brand);
      width: 24px;
      height: 24px;
    }
    .quick-action strong {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .quick-action span {
      color: var(--soft);
      font-size: 0.74rem;
      line-height: 1.5;
    }

    /* ── Search & Toolbar ─────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
      flex-wrap: wrap;
    }
    .toolbar :is(input, select, .search) {
      min-height: 42px;
      max-width: 100%;
    }
    .search {
      min-width: 210px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
    }
    .search input {
      width: 100%;
      height: 38px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 0.85rem;
    }
    .filters {
      display: flex;
      gap: 8px;
    }

    /* ── Forms & Input Fields ──────────────────────────────────────── */
    select, input, textarea {
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
    }
    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.55;
    }
    option {
      color: var(--text);
      background: var(--surface);
    }
    label {
      color: var(--soft);
      font-size: 0.72rem;
      font-weight: 780;
      letter-spacing: 0.02em;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .field.full { grid-column: 1/-1 }
    .help {
      color: var(--faint);
      font-size: 0.68rem;
    }
    .field :is(input, select, textarea) {
      width: 100%;
      max-width: 100%;
    }
    input::placeholder, textarea::placeholder {
      color: var(--faint);
      opacity: 0.85;
    }

    /* ── Status Badges & Pills ─────────────────────────────────────── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 29px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--soft);
      background: var(--surface-2);
      font-size: 0.64rem;
      font-weight: 850;
      letter-spacing: 0.06em;
      max-width: 100%;
      height: auto;
      white-space: normal;
      text-align: left;
      line-height: 1.35;
    }
    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
      background: var(--faint);
      flex: 0 0 auto;
    }
    .status.publish::before, .status.approved::before { background: var(--success) }
    .status.pending::before { background: var(--warning) }
    .status.rejected::before { background: var(--danger) }
    .status.draft::before { background: var(--faint) }

    [data-theme="light"] .status { color: #1e3325; background: #eef3eb }
    [data-theme="dark"] .status { color: #e4eee2; background: #152a1d }

    /* ── Content Record Cards ──────────────────────────────────────── */
    .record-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 18px;
    }

    .record {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 22px;
      padding: 24px;
      height: 100%;
      transition: all var(--dur) var(--ease);
    }
    .record:hover {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--brand) 42%, var(--line));
      box-shadow: var(--shadow);
    }
    .record-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .record h3 {
      margin: 16px 0 8px;
      font-size: 1.18rem;
    }
    .record-summary {
      display: -webkit-box;
      overflow: hidden;
      color: var(--soft);
      font-size: 0.8rem;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow-wrap: anywhere;
      min-width: 0;
    }
    .record-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 18px;
      align-self: end;
      justify-content: flex-end;
    }
    .record-actions .btn { flex: 1 1 120px }

    /* ── Workflow Strips & Visual Stepper ──────────────────────────── */
    .workflow-strip {
      display: grid;
      gap: 11px;
      margin-bottom: 24px;
    }

    .workflow-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(180px, auto);
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(130deg, var(--surface), color-mix(in srgb, var(--surface-2) 55%, var(--surface)));
      box-shadow: var(--shadow-xs);
      isolation: isolate;
      overflow: hidden;
    }
    .workflow-item strong, .workflow-item span { display: block }
    .workflow-item span { color: var(--faint); font-size: 0.71rem }
    .workflow-item .button-row { justify-content: flex-end }
    .workflow-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .workflow-note {
      margin-top: 4px;
      padding: 8px 11px;
      border-left: 3px solid var(--warning);
      border-radius: 0 10px 10px 0;
      color: var(--soft);
      background: var(--surface-2);
      font-size: 0.74rem;
    }

    .workflow-guide {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 24px;
    }
    .workflow-step {
      position: relative;
      display: grid;
      gap: 5px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--faint);
      background: var(--surface-2);
      transition: all var(--dur) var(--ease);
    }
    .workflow-step::after {
      position: absolute;
      top: 50%;
      right: -9px;
      width: 10px;
      height: 1px;
      content: "";
      background: var(--line);
    }
    .workflow-step:last-child::after { display: none }
    .workflow-step b {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }
    .workflow-step span {
      font-size: 0.65rem;
    }
    .workflow-step.active {
      color: var(--text);
      border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
      background: var(--brand-soft);
      box-shadow: inset 3px 0 0 var(--brand);
    }
    .workflow-step.done {
      color: var(--brand);
    }

    /* ── Status Legend ─────────────────────────────────────────────── */
    .status-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .status-legend > span:last-child {
      align-self: center;
      margin-left: auto;
      color: var(--faint);
      font-size: 0.7rem;
    }

    /* ── Approvals Section ─────────────────────────────────────────── */
    .approval-tabs {
      position: sticky;
      z-index: 8;
      top: calc(var(--topbar) + 10px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(20px);
      margin-bottom: 20px;
    }
    .approval-tab {
      min-height: 40px;
      padding: 8px 16px;
      border: 0;
      border-radius: 10px;
      color: var(--soft);
      background: transparent;
      font-weight: 780;
      font-size: 0.8rem;
      transition: all var(--dur) var(--ease);
    }
    .approval-tab:hover, .approval-tab.active {
      color: var(--text);
      background: var(--brand-soft);
    }

    .approval-list { display: grid; gap: 14px }
    .approval-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 24px;
    }
    .approval-card > div:first-child { min-width: 0 }
    .approval-card h3 {
      font-size: clamp(1.22rem, 2vw, 1.65rem);
      line-height: 1.15;
      margin-top: 14px;
    }
    .approval-card > .button-row {
      min-width: 180px;
      justify-content: flex-end;
    }
    .approval-meta, .service-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--faint);
      font-size: 0.72rem;
    }

    .payload {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
      gap: 10px 18px;
      margin-top: 16px;
      padding: 16px;
      border-radius: 13px;
      background: var(--surface-2);
    }
    .payload div { min-width: 0 }
    .payload small, .payload strong { display: block }
    .payload small {
      color: var(--faint);
      font-size: 0.63rem;
      text-transform: uppercase;
      font-weight: 750;
    }
    .payload strong {
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
      overflow-wrap: anywhere;
      margin-top: 3px;
      font-size: 0.78rem;
      line-height: 1.55;
      color: var(--soft);
    }
    .payload .payload-wide { grid-column: 1/-1 }

    /* ── Pastoral Service Requests ─────────────────────────────────── */
    .service-list { display: grid; gap: 14px }
    .service-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(200px, 0.34fr);
      align-items: center;
      gap: 24px;
      padding: 24px;
    }
    .service-card h3 {
      margin: 12px 0 7px;
      font-size: clamp(1.22rem, 2.2vw, 1.75rem);
    }
    .service-card p {
      max-width: 760px;
      margin: 0 0 10px;
      line-height: 1.68;
      white-space: pre-wrap;
    }
    .service-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: center;
      justify-content: flex-end;
    }
    .service-actions .btn { justify-content: center }

    .privacy-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 11px;
      border-radius: 999px;
      color: var(--text);
      background: var(--brand-soft);
      font-size: 0.64rem;
      font-weight: 850;
      max-width: 100%;
      height: auto;
      white-space: normal;
      text-align: left;
      line-height: 1.3;
    }
    .service-card.restricted { border-style: dashed }
    [data-theme="light"] .privacy-chip { color: #132019 }
    [data-theme="dark"] .privacy-chip { color: #f5f7ef }

    /* ── Portal Administrators (Users) ─────────────────────────────── */
    .user-list { display: grid; gap: 13px }
    .user-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 22px;
    }
    .user-card .button-row { align-self: center }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .role-card strong, .role-card span { display: block }
    .role-card strong { font-weight: 850; font-size: 0.95rem }
    .role-card span {
      margin-top: 6px;
      color: var(--soft);
      font-size: 0.7rem;
      line-height: 1.5;
    }

    /* ── Activity & Audit Logs ─────────────────────────────────────── */
    .activity-list { display: grid; gap: 11px }
    .activity-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .activity-dot {
      width: 11px;
      height: 11px;
      margin-top: 5px;
      border: 3px solid var(--brand-soft);
      border-radius: 50%;
      background: var(--brand);
    }
    .activity-row strong, .activity-row span { display: block }
    .activity-row span { color: var(--soft); font-size: 0.73rem }
    .activity-row time { color: var(--faint); font-size: 0.67rem; text-align: right }

    /* ── Dialogs & Modals ──────────────────────────────────────────── */
    dialog {
      width: min(740px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      max-width: min(740px, calc(100vw - 24px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 26px;
      margin: auto;
      overflow: hidden;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }
    dialog::backdrop {
      background: rgba(4, 12, 7, 0.72);
      backdrop-filter: blur(14px);
    }
    dialog[open] { display: flex; flex-direction: column }
    dialog > form {
      width: 100%;
      min-width: 0;
      max-height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .modal-head > div:first-child { min-width: 0 }
    .modal-head strong, .modal-head span {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .modal-head strong { font-size: 1.05rem }

    .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: clamp(22px, 3.8vw, 36px);
    }

    .modal-foot {
      position: sticky;
      bottom: 0;
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding: 16px 22px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .modal-foot .btn { flex: 0 1 auto }

    /* ── Review Reason Section ─────────────────────────────────────── */
    .review-title { margin: 16px 0 4px }
    .review-reason {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--danger) 34%, var(--line));
      border-radius: 14px;
      background: color-mix(in srgb, var(--danger) 7%, var(--surface));
      scroll-margin: 18px;
    }
    .review-reason.show {
      display: grid !important;
      visibility: visible !important;
      opacity: 1 !important;
      gap: 14px;
      animation: reason-in 0.28s var(--ease);
    }
    .reason-head { display: flex; gap: 11px; align-items: flex-start }
    .reason-head .icon { margin-top: 2px; color: var(--danger) }
    .reason-head strong, .reason-head span { display: block }
    .reason-head span { margin-top: 3px; color: var(--soft); font-size: 0.73rem }
    .review-reason textarea {
      min-height: 120px;
      border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
      background: var(--surface);
    }
    .reason-help { color: var(--faint); font-size: 0.68rem }
    .reason-help.error { color: var(--danger); font-weight: 800 }
    @keyframes reason-in { from { opacity: 0; transform: translateY(8px) } }

    /* ── Editor Preview & 16:9 Projector Mode ──────────────────────── */
    .editor-preview {
      display: none;
      grid-column: 1/-1;
      margin-top: 8px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }
    .editor-preview.show { display: block }

    .editor-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .editor-preview-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }
    .editor-preview-card h3 { margin: 8px 0 10px }
    .editor-preview-card dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0 0;
    }
    .editor-preview-card dl div {
      min-width: 0;
      padding: 11px;
      border-radius: 11px;
      background: var(--surface-2);
    }
    .editor-preview-card dt {
      color: var(--faint);
      font-size: 0.65rem;
      font-weight: 850;
      text-transform: uppercase;
    }
    .editor-preview-card dd {
      margin: 5px 0 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .editor-validation { display: grid; gap: 8px; margin-bottom: 16px }
    .editor-validation-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 11px;
      color: var(--soft);
      background: var(--surface);
    }
    .editor-validation-row.ready .icon { color: var(--success) }
    .editor-validation-row.warning .icon { color: var(--warning) }

    .editor-projector {
      position: relative;
      aspect-ratio: 16/9;
      display: grid;
      grid-template-columns: minmax(120px, 0.62fr) minmax(0, 1.38fr);
      gap: 14px;
      padding: 16px;
      overflow: hidden;
      border-radius: var(--radius);
      color: #fff;
      background:
        radial-gradient(circle at 90% 0, rgba(221, 197, 125, 0.2), transparent 32%),
        linear-gradient(135deg, #03130a, #15452b);
    }
    .editor-projector::after {
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(239, 214, 146, 0.32);
      border-radius: 13px;
      content: "";
      pointer-events: none;
    }
    .editor-projector > * { position: relative; z-index: 1 }

    .editor-projector-title {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      border-radius: 13px;
      background: rgba(0, 0, 0, 0.28);
    }
    .editor-projector-title small {
      color: #e5cb81;
      font-size: 0.56rem;
      font-weight: 850;
      letter-spacing: 0.12em;
    }
    .editor-projector-title strong {
      margin-top: 8px;
      font-size: clamp(1.05rem, 3vw, 2rem);
      line-height: 0.94;
    }
    .editor-projector-title span {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.64rem;
    }

    .editor-projector-fields {
      display: grid;
      align-content: center;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 14px;
      margin: 0;
      padding: 14px;
      border-radius: 13px;
      background: rgba(0, 0, 0, 0.22);
    }
    .editor-projector-fields div {
      min-width: 0;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }
    .editor-projector-fields dt {
      color: #dfc579;
      font-size: 0.5rem;
      font-weight: 850;
      text-transform: uppercase;
    }
    .editor-projector-fields dd {
      margin: 2px 0 0;
      overflow: hidden;
      font-size: clamp(0.68rem, 1.6vw, 1.05rem);
      font-weight: 750;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Image Upload Panels ───────────────────────────────────────── */
    .image-upload-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }
    .image-upload-panel strong, .image-upload-panel span { display: block }
    .image-upload-panel span { margin-top: 4px; color: var(--soft); font-size: 0.73rem }
    .image-collection { min-height: 150px }

    /* ── Empty State ───────────────────────────────────────────────── */
    .empty {
      padding: 56px 24px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
      color: var(--soft);
      text-align: center;
    }
    .empty .icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      color: var(--brand);
    }

    /* ── Loading Overlay & Screen ──────────────────────────────────── */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      color: #eff6ec;
      background: radial-gradient(42rem 34rem at 50% 45%, #254c33, #051109 74%);
      transition: opacity 0.4s var(--ease), visibility 0.4s var(--ease);
    }
    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-mark {
      position: relative;
      width: 126px;
      height: 126px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
    }
    .loader-mark::before, .loader-mark::after {
      position: absolute;
      inset: -16px;
      border: 1px solid rgba(226, 210, 165, 0.22);
      border-radius: 50%;
      content: "";
      animation: cinema-ring 2.6s var(--ease) infinite;
    }
    .loader-mark::after {
      inset: -42px;
      animation-delay: -1.3s;
    }
    @keyframes cinema-ring {
      0%, 100% { transform: scale(0.9); opacity: 0.2 }
      50% { transform: scale(1.06); opacity: 0.8 }
    }

    .orbit {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(220, 237, 214, 0.32);
      border-radius: 50%;
      animation: spin 2.8s linear infinite;
    }
    .orbit::after {
      position: absolute;
      left: 50%;
      top: -4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      content: "";
      background: #d9c080;
      box-shadow: 0 0 18px #d9c080;
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    .cross { display: none !important }
    .loader-advent {
      width: 62px;
      height: 62px;
      object-fit: contain;
      filter: none !important;
      animation: admin-float 2.2s ease-in-out infinite;
    }
    .loader-note {
      display: block;
      margin-top: 7px;
      color: rgba(244, 248, 240, 0.58);
      font-size: 0.62rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-align: center;
      text-transform: uppercase;
    }
    .loader p {
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.77rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }
    @keyframes admin-float { 50% { transform: translateY(-5px) } }

    /* ── Error & Recovery Gate ─────────────────────────────────────── */
    .gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(46rem 36rem at 50% 25%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 72%), var(--bg);
    }
    .gate-card {
      width: min(700px, 100%);
      padding: clamp(38px, 7.2vw, 74px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      text-align: left;
    }
    .gate-logo {
      width: 70px;
      height: 70px;
      margin: 0 0 28px;
      object-fit: contain;
      display: block;
      filter: none !important;
    }
    .gate-card h1 {
      max-width: 580px;
      font-size: clamp(2.9rem, 8vw, 6rem);
      letter-spacing: -0.07em;
    }
    .gate-message { font-size: 1.02rem }
    .steps { display: grid; gap: 11px; margin: 30px 0; text-align: left }
    .step {
      display: flex;
      gap: 13px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-2);
    }
    .step b {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 9px;
      color: #fff;
      background: var(--brand-2);
    }

    /* ── Toast Notifications ───────────────────────────────────────── */
    .toast-zone {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 400;
      display: grid;
      gap: 9px;
    }
    .toast {
      max-width: 380px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: toast 0.35s var(--ease);
      font-size: 0.82rem;
      font-weight: 650;
    }
    @keyframes toast { from { opacity: 0; transform: translateY(12px) } }

    /* ── Dashboard Realtime Sync Banner ────────────────────────────── */
    /* GALILEA-ADMIN-BOOTSTRAP-35-8-0 · shell cepat, statistik menyusul tanpa mengunci portal */
    .dashboard-sync {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 20px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--soft);
      background: var(--surface);
      font-size: 0.75rem;
      font-weight: 720;
      box-shadow: var(--shadow-xs);
    }
    .dashboard-sync-copy {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }
    .dashboard-sync-copy .icon {
      flex: 0 0 auto;
      color: var(--brand);
    }
    .dashboard-sync.is-loading .icon { animation: spin 1.2s linear infinite }
    .dashboard-sync.is-error {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
      background: color-mix(in srgb, var(--danger) 6%, var(--surface));
    }
    .dashboard-sync .btn {
      min-height: 36px;
      padding: 7px 14px;
      font-size: 0.7rem;
    }

    /* ── Adaptive Church Logo ──────────────────────────────────────── */
    .theme-logo-pair {
      position: relative;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 6px 18px rgba(13, 49, 29, 0.1);
      isolation: isolate;
    }
    .theme-logo-pair > img {
      grid-area: 1/1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: none !important;
      opacity: 1;
      transition: opacity 0.22s var(--ease), transform 0.3s var(--ease);
    }
    .theme-logo-pair .logo-dark { display: none }
    [data-theme="dark"] .theme-logo-pair .logo-light { display: none }
    [data-theme="dark"] .theme-logo-pair .logo-dark { display: block }
    .brand-logo { width: 44px; height: 44px; filter: none !important }
    .brand:hover .theme-logo-pair > img { transform: scale(1.05) }
    .official-advent-logo { display: block; object-fit: contain }
    [data-theme="dark"] .gate-logo { filter: brightness(0) invert(1) }

    /* ── Dark Mode Refinements ─────────────────────────────────────── */
    [data-theme="light"] .nav-item { color: #425648 }
    [data-theme="light"] .nav-item.active { color: #fff }
    [data-theme="dark"] .nav-item { color: #b8ccbe }
    [data-theme="dark"] .nav-item.active { color: #07120b }

    [data-theme="dark"] :is(.card, .record, .service-card, .user-card, .metric, .quick-action, .role-card, .workflow-item, .toolbar, dialog > form) {
      color: var(--text);
      border-color: var(--line);
      background: var(--surface);
    }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
      color: #f4f8f1;
      background: #132419;
      border-color: rgba(210, 232, 205, 0.18);
    }
    [data-theme="dark"] option {
      color: #f4f8f1;
      background: #132419;
    }

    [data-theme="light"] .card, [data-theme="light"] .toolbar, [data-theme="light"] dialog, [data-theme="light"] .workflow-item, [data-theme="light"] .activity-row { color: #0e1912 }
    [data-theme="dark"] .card, [data-theme="dark"] .toolbar, [data-theme="dark"] dialog, [data-theme="dark"] .workflow-item, [data-theme="dark"] .activity-row { color: #f3f8f1 }

    /* ── Comprehensive Responsive Lock ─────────────────────────────── */
    /* responsive admin lock: iPhone, Android, tablet, dan desktop */

    @media (max-width: 980px) {

      .approval-card > .button-row { min-width: 0; justify-content: flex-start }

      .record { grid-template-columns: 1fr }
      .record-actions { justify-content: flex-start }

    @media (max-width: 850px) {

      .admin-shell { display: block; min-height: 100dvh }

      .sidebar {

      .mobile-menu { display: grid; flex: 0 0 44px }

      .topbar {

        border-bottom: 0;
      }
      .crumb { min-width: 0 }

      }
      .crumb span { display: none }
      .top-actions { flex: 0 0 auto; flex-wrap: nowrap }
      .top-actions .icon-btn { flex: 0 0 44px }

      .content {
        width: calc(100% - 20px);
        margin-inline: 10px;
        padding: 28px 0 calc(48px + env(safe-area-inset-bottom));
      }
      .page-head { align-items: stretch; gap: 18px; margin-bottom: 22px }

      .hero-admin { padding: 32px 24px; border-radius: 24px }

      .grid-4, .grid-3, .grid-2, .quick-grid, .record-grid {

      .toolbar { align-items: stretch; flex-direction: column; padding: 10px }

      .approval-card, .service-card, .user-card { grid-template-columns: 1fr }
      .approval-card > .button-row, .service-card > .button-row, .user-card > .button-row { justify-content: flex-start }

    @media (max-width: 680px) {

      .service-actions .btn, .record-actions .btn, .user-card .btn, .approval-card .btn { width: 100%; justify-content: center }

      .approval-tabs { position: static; display: grid; grid-template-columns: 1fr; padding: 6px }

      dialog { width: calc(100vw - 12px); max-width: none; max-height: calc(100dvh - 12px); margin: 6px }

      .modal-foot { display: grid; grid-template-columns: 1fr }
      .modal-foot .btn { width: 100%; justify-content: center }

    @media (max-width: 600px) {

      .status-legend > span:last-child { width: 100%; margin-left: 0 }
      .toast-zone { right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); left: 8px }
      .toast { width: 100%; max-width: none }
      .gate { padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)) }
      .gate-card { padding: 30px 22px; border-radius: 22px }
      .gate-card h1 { font-size: clamp(2.7rem, 14vw, 4.3rem) }
      .brand-logo { width: 39px; height: 39px }
      .gate-logo { width: 62px; height: 62px }
      .loader-advent { width: 54px; height: 54px }
      .dashboard-sync { align-items: stretch; flex-direction: column }
      .dashboard-sync .btn { width: 100% }
      .image-upload-panel { align-items: flex-start; flex-direction: column }
    }

    @media (max-width: 420px) {
      .brand-copy small, .crumb { display: none }
      .top-actions .btn span { display: none }
      .metric, .quick-action { padding: 18px }
    }

    @media (max-width: 374px) {
      .top-actions .icon-btn { width: 42px; height: 42px; flex-basis: 42px }

      .hero-admin { padding: 25px 18px }

      .modal-head { gap: 10px }

    @media (orientation: landscape) and (max-height: 520px) and (max-width: 950px) {
      .sidebar { width: min(72vw, 320px) }
      .hero-admin { padding: 24px }
      .topbar { position: relative }
      .content { padding-top: 22px }
      dialog, dialog > form { max-height: calc(100dvh - 10px) }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

        transition-duration: 0.01ms !important;

      .orbit, .loader-advent { animation: none !important }
      .loader-mark::before, .loader-mark::after { animation: none !important }
      .quick-action, .record, .metric, .btn::after { transition: none !important }
      .theme-logo-pair > img { transition: none }
    }
  </style>

  <div class="loader" id="loader"><div><div class="loader-mark"><span class="orbit"></span><span class="theme-logo-pair loader-advent" aria-hidden="true"><img class="logo-light" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-light.webp" alt=""><img class="logo-dark" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-dark.webp" alt=""></span></div><p>Menyiapkan ruang kerja Galilea</p><span class="loader-note">Konten · Persetujuan · Pelayanan</span></div></div>
  <div id="root"></div>
  <div class="toast-zone" id="toasts" aria-live="polite"></div>

  <dialog id="editor-dialog">
    <form id="editor-form">
      <div class="modal-head"><div><strong id="editor-title">Editor</strong><div class="small faint" id="editor-subtitle"></div></div><button class="icon-btn" type="button" data-close="editor-dialog"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <div class="modal-body"><div id="editor-workflow"></div><div class="form-grid" id="editor-fields"></div><section class="editor-preview" id="editor-preview" aria-live="polite"></section></div>
      <div class="modal-foot"><button class="btn" type="button" data-close="editor-dialog">Batal</button><button class="btn" type="button" data-preview-editor>Pratinjau</button><button class="btn soft" type="submit" name="intent" value="draft">Simpan Draft</button><button class="btn primary" type="submit" name="intent" value="submit"><svg class="icon"><use href="#i-send"/></svg>Ajukan Persetujuan</button></div>
    </form>
  </dialog>

  <dialog id="service-dialog"><div class="modal-head"><strong>Permohonan Jemaat</strong><button class="icon-btn" type="button" data-close="service-dialog"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="modal-body" id="service-body"></div><div class="modal-foot"><button class="btn" type="button" data-close="service-dialog">Tutup</button><button class="btn primary" type="button" id="save-service">Simpan Status</button></div></dialog>
  <dialog id="user-dialog"><form id="user-form"><div class="modal-head"><strong>Pengelola Portal</strong><button class="icon-btn" type="button" data-close="user-dialog"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="modal-body"><div class="form-grid"><input type="hidden" name="id"><div class="field full"><label>Nama</label><input name="name" required></div><div class="field full"><label>Email Google</label><input name="email" type="email" required></div><div class="field"><label>Peran</label><select name="role"><option>VIEWER</option><option>EDITOR</option><option>APPROVER</option><option>SUPERADMIN</option></select></div><div class="field"><label>Status</label><select name="status"><option>AKTIF</option><option>NONAKTIF</option></select></div></div></div><div class="modal-foot"><button class="btn" type="button" data-close="user-dialog">Batal</button><button class="btn primary" type="submit">Simpan Pengelola</button></div></form></dialog>

  <script>
  (function(){
    'use strict';
    const APP_URL = <?!= JSON.stringify(appUrl || '') ?>;
    const $=(s,c)=>(c||document).querySelector(s), $$=(s,c)=>Array.from((c||document).querySelectorAll(s));
    const state={boot:null,route:'dashboard',entity:null,entityData:null,search:'',status:'ALL',approvalStatus:'PENDING',approvals:[],approvalCache:{},currentEdit:null,currentReview:null,reviewMode:'',currentService:null,users:[],services:[],activity:null,searchTimer:null,dashboardRequest:0};
    const icon=name=>'<svg class="icon"><use href="#i-'+name+'"/></svg>';
    const logoMark=className=>'<span class="theme-logo-pair '+attr(className||'brand-logo')+'" role="img" aria-label="Logo GMAHK Galilea"><img class="logo-light" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-light.webp" alt=""><img class="logo-dark" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-dark.webp" alt=""></span>';
    const esc=value=>String(value==null?'':value).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    const attr=esc;
    function server(name,args,timeoutMs){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('Server admin belum merespons. Coba kembali; data Anda tidak berubah.'))}},Math.max(8000,Number(timeoutMs)||25000));const finish=fn=>value=>{if(done)return;done=true;clearTimeout(timer);fn(value)};if(typeof google!=='undefined'&&google.script&&google.script.run&&typeof google.script.run[name]==='function'){const runner=google.script.run.withSuccessHandler(finish(resolve)).withFailureHandler(finish(error=>reject(new Error(error&&error.message?error.message:String(error)))));runner[name].apply(runner,args||[]);return}fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:name,args:args||[]})}).then(res=>res.json()).then(payload=>{if(!payload||payload.ok===false){finish(error=>reject(new Error(error&&error.message?error.message:String(error))))(payload&&payload.error?payload.error:'Terjadi gangguan server admin.')}else{finish(resolve)(payload.data!==undefined?payload.data:payload)}}).catch(finish(error=>reject(new Error(error&&error.message?error.message:String(error)))))})}
    function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),3800)}
    function setBusy(button,busy,label){if(!button)return;button.disabled=busy;if(busy){button.dataset.old=button.innerHTML;button.textContent=label||'Memproses…'}else if(button.dataset.old){button.innerHTML=button.dataset.old;delete button.dataset.old}}
    function status(value){const raw=String(value||'DRAFT').toUpperCase(),key=raw.toLowerCase(),labels={DRAFT:'Draf',PENDING:'Menunggu Tinjauan',REVIEW:'Sedang Ditinjau',APPROVED:'Sudah Disetujui',PUBLISH:'Sudah Terbit',REJECTED:'Perlu Revisi'};return '<span class="status '+key+'" title="Status: '+attr(labels[raw]||raw)+'">'+esc(labels[raw]||raw)+'</span>'}
    function friendlyEntity(key){const item=(state.boot.entities||[]).find(e=>e.key===key);return item?item.label:key}
    function initials(name){return String(name||'A').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('galilea:admin-theme',theme);const button=$('#theme-toggle');if(button)button.innerHTML=icon(theme==='dark'?'sun':'moon')}
    function currentTheme(){return localStorage.getItem('galilea:admin-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}

    function shell(){
      const user=state.boot.user, d=state.boot.dashboard;
      const entityNav=state.boot.entities.filter(e=>!['settings','schedule'].includes(e.key)).map(e=>nav(e.key,e.icon,e.label)).join('');
      return '<div class="admin-shell"><div class="mobile-overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><a class="brand" href="#dashboard">'+logoMark('brand-logo')+'<span><strong>Portal Sekretariat</strong><span>GMAHK Galilea Balikpapan</span><span class="build-badge">BUILD V'+esc(state.boot.version)+'</span></span></a><div class="nav-scroll"><div class="nav-label">Ringkasan</div>'+nav('dashboard','grid','Dashboard')+'<div class="nav-label">Kelola Konten</div>'+entityNav+nav('settings','settings','Identitas & Tampilan')+nav('schedule','calendar','Jadwal Pelayanan')+(user.permissions.edit?'<div class="nav-label">Operasional</div>'+nav('services','heart','Layanan Jemaat'):'')+(user.permissions.approve?nav('approvals','check','Persetujuan',d.pendingApprovals)+nav('activity','clock','Audit & Aktivitas'):'')+(user.permissions.manageAdmins?nav('users','shield','Pengelola Portal'):'')+(user.permissions.edit?nav('system','settings','Sistem & Backup'):'')+'</div><div class="sidebar-user"><div class="user-row"><span class="avatar">'+esc(initials(user.name))+'</span><span><strong>'+esc(user.name)+'</strong><span>'+esc(user.role)+' · '+esc(user.email)+'</span></span></div></div></aside><section class="workspace"><header class="topbar"><div class="button-row"><button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Buka menu">'+icon('menu')+'</button><div class="crumb"><strong id="crumb-title">Dashboard</strong><span>Kelola website dan pelayanan jemaat</span></div></div><div class="top-actions"><a class="icon-btn" href="'+attr(state.boot.publicSite.publicUrl||APP_URL)+'" target="_blank" rel="noopener" title="Buka website">'+icon('external')+'</a><button class="icon-btn" id="theme-toggle" aria-label="Ganti tema">'+icon(currentTheme()==='dark'?'sun':'moon')+'</button></div></header><main class="content" id="content"></main></section></div>';
    }
    function nav(route,iconName,label,count){const value=Math.max(0,Number(count)||0);return '<button class="nav-item" data-route="'+attr(route)+'">'+icon(iconName)+'<span>'+esc(label)+'</span><span class="count" data-nav-count="'+attr(route)+'" '+(value?'':'hidden')+'>'+esc(value)+'</span></button>'}
    function closeSidebar(){$('#sidebar')?.classList.remove('open');$('#overlay')?.classList.remove('open')}
    function routeTitle(){if(state.route==='dashboard')return'Dashboard';if(state.route==='services')return'Layanan Jemaat';if(state.route==='approvals')return'Persetujuan';if(state.route==='activity')return'Audit & Aktivitas';if(state.route==='users')return'Pengelola Portal';if(state.route==='system')return'Sistem & Backup';return friendlyEntity(state.route)}
    function navigate(route){state.route=route;state.search='';state.status='ALL';location.hash=route;$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===route));$('#crumb-title').textContent=routeTitle();closeSidebar();renderRoute()}

    async function renderRoute(){const box=$('#content');box.innerHTML=loadingCard('Menyiapkan '+routeTitle());try{if(state.route==='dashboard')return renderDashboard();if(state.route==='services')return await loadServices();if(state.route==='approvals')return await loadApprovals();if(state.route==='activity')return await loadActivity();if(state.route==='users')return await loadUsers();if(state.route==='system')return renderSystem();return await loadEntity(state.route)}catch(error){box.innerHTML=errorBox(error.message)}}
    function loadingCard(label){return '<div class="empty"><div class="loader-mark" style="width:72px;height:72px"><span class="orbit"></span>'+logoMark('loader-advent')+'</div><strong>'+esc(label||'Memuat')+'</strong><p class="muted small">Menyambungkan data terbaru…</p></div>'}
    function errorBox(message){return '<div class="empty">'+icon('info')+'<h3>Bagian ini belum dapat dimuat</h3><p>'+esc(cleanError(message))+'</p><button class="btn" data-retry>Coba kembali</button></div>'}
    function cleanError(message){return String(message||'Terjadi gangguan.').replace(/^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/,'')}

    function renderDashboard(){const d=state.boot.dashboard,u=state.boot.user,canEdit=u.permissions.edit,loading=Boolean(d.loading),publicToday=String(state.boot.publicSite.publicUrl||APP_URL).replace(/#.*$/,'')+'#today';const heroActions=canEdit?'<div class="button-row"><button class="btn primary" data-route="worshipPlans">Siapkan ibadah '+icon('plus')+'</button><button class="btn" data-route="schedule">Edit jadwal</button><a class="btn soft" href="'+attr(publicToday)+'" target="_blank" rel="noopener">Buka Mode Operator '+icon('external')+'</a></div>':'';const quickItems=canEdit?quick('worshipPlans','calendar','Susunan Ibadah','Atur tema, ayat, lagu, dan urutan ibadah.')+quick('themeSong','music','Lagu Tema','Isi Ayat 1, Ayat 2, ayat tambahan, dan Reff secara jelas.')+quick('announcements','bell','Agenda dan Pengumuman','Atur informasi yang aktif dan masuk ke Warta.')+quick('activities','calendar','Berita Jemaat','Dokumentasikan kegiatan yang sudah berlangsung.')+quick('schedule','calendar','Jadwal Pelayanan','Perbarui pembagian tugas ibadah.')+quick('services','heart','Layanan Jemaat','Tindak lanjuti doa dan kunjungan.')+quick('system','settings','Kesehatan Sistem','Periksa cache, sumber, dan backup.'):quick('worshipPlans','calendar','Susunan Ibadah','Lihat tema, ayat, lagu, dan urutan ibadah.')+quick('themeSong','music','Lagu Tema','Lihat lagu tema aktif.')+quick('announcements','bell','Agenda dan Pengumuman','Lihat informasi yang sudah diterbitkan.');const syncClass=d.error?' is-error':loading?' is-loading':'';const syncText=d.error?'Statistik belum tersambung: '+d.error:loading?'Portal sudah siap. Statistik terbaru sedang disinkronkan…':'Statistik terhubung · '+d.updatedAt;const syncAction=loading?'':'<button class="btn" type="button" data-dashboard-refresh>'+icon('refresh')+(d.error?'Coba lagi':'Perbarui')+'</button>';const metricValue=value=>loading?'—':value==null?'—':value;$('#content').innerHTML='<section class="hero-admin"><div><span class="eyebrow">GALILEA CONTROL CENTER</span><h1>Selamat datang, '+esc(u.name)+'.</h1><p>'+(canEdit?'Kelola seluruh konten website, jadwal pelayanan, dan kebutuhan jemaat melalui satu portal yang aman.':'Akses baca Anda siap. Seluruh konten publik dapat diperiksa melalui satu portal yang aman.')+'</p>'+heroActions+'</div><aside class="hero-status"><div><span>Peran Anda</span><strong>'+esc(u.role)+'</strong></div><div><span>Data terakhir</span><strong>'+esc(d.updatedAt)+'</strong></div><div><span>Sheet jadwal</span><strong>'+esc(d.scheduleSheet)+'</strong></div><div><span>Status sumber</span><strong>'+esc(d.systemStatus)+'</strong></div></aside></section><div class="dashboard-sync'+syncClass+'"><span class="dashboard-sync-copy">'+icon(d.error?'info':'refresh')+'<span>'+esc(syncText)+'</span></span>'+syncAction+'</div><div class="grid grid-4">'+metric('check',metricValue(d.pendingApprovals),'Menunggu persetujuan',loading)+metric('edit',metricValue(d.myDrafts),'Draft milik saya',loading)+metric('bell',metricValue(d.activeAnnouncements),'Agenda aktif',loading)+metric('heart',metricValue(d.serviceRequests),'Layanan perlu ditangani',loading)+'</div><div class="section-head"><div><span class="eyebrow">AKSES CEPAT</span><h2>'+(canEdit?'Kerjakan lebih singkat.':'Periksa informasi website.')+'</h2></div></div><div class="quick-grid">'+quickItems+'</div>'}
    function metric(iconName,value,label,loading){return '<article class="card metric '+(loading?'is-loading':'')+'"><span class="metric-icon">'+icon(iconName)+'</span><div><strong>'+esc(value)+'</strong><span>'+esc(label)+'</span></div></article>'}
    function quick(route,iconName,title,description){return '<button class="quick-action" data-route="'+route+'">'+icon(iconName)+'<span><strong>'+esc(title)+'</strong><span>'+esc(description)+'</span></span></button>'}

    function syncApprovalBadge(){const badge=$('[data-nav-count="approvals"]');if(!badge||!state.boot)return;const value=Math.max(0,Number(state.boot.dashboard.pendingApprovals)||0);badge.textContent=value;badge.hidden=!value}
    async function loadDashboardSummary(showError){if(!state.boot)return;const request=++state.dashboardRequest;state.boot.dashboard.loading=true;state.boot.dashboard.error='';if(state.route==='dashboard')renderDashboard();try{const result=await server('adminGetDashboardSummary',[],32000);if(request!==state.dashboardRequest)return;if(result&&result.dashboard)state.boot.dashboard=Object.assign({},state.boot.dashboard,result.dashboard,{loading:false,error:''});if(result&&result.publicSite)state.boot.publicSite=Object.assign({},state.boot.publicSite,result.publicSite);syncApprovalBadge();if(state.route==='dashboard')renderDashboard()}catch(error){if(request!==state.dashboardRequest)return;state.boot.dashboard.loading=false;state.boot.dashboard.error=cleanError(error.message);if(state.route==='dashboard')renderDashboard();if(showError)toast(state.boot.dashboard.error)}}

    async function loadActivity(){state.activity=await server('adminGetDashboardActivity',[]);const audit=state.activity.audit||[],health=state.activity.health||[];$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">JEJAK PERUBAHAN</span><h1>Audit & Aktivitas</h1><p>Riwayat tindakan pengelola dan hasil pemeriksaan sumber terakhir.</p></div><button class="btn" data-reload>'+icon('refresh')+'Muat ulang</button></div><div class="grid grid-2"><section><div class="section-head" style="margin-top:0"><h3>Aktivitas terbaru</h3></div><div class="activity-list">'+(audit.length?audit.map(activityHtml).join(''):emptyHtml('Belum ada aktivitas yang tercatat.'))+'</div></section><section><div class="section-head" style="margin-top:0"><h3>Status sumber terakhir</h3></div><div class="activity-list">'+(health.length?health.map(item=>'<article class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(item.source)+'</strong><span>'+esc(item.note||'Tidak ada catatan.')+'</span></div>'+status(item.status)+'</article>').join(''):emptyHtml('Pemeriksaan sistem belum pernah dijalankan.'))+'</div></section></div>'}
    function activityHtml(item){return '<article class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(item.name||item.email)+' · '+esc(item.action)+'</strong><span>'+esc(friendlyEntity(item.entity))+(item.detail?' · '+esc(item.detail):'')+'</span></div><time>'+esc(item.time)+'</time></article>'}

    async function loadEntity(key){state.entity=key;state.entityData=await server('adminListEntity',[key]);renderEntity()}
    function renderEntity(){const data=state.entityData,canEdit=state.boot.user.permissions.edit;let records=data.records||[];const query=state.search.toLowerCase();if(query)records=records.filter(r=>JSON.stringify(r).toLowerCase().includes(query));if(state.status!=='ALL')records=records.filter(r=>String(r.status).toUpperCase()===state.status);const canAdd=canEdit&&data.entity!=='settings';const legend='<div class="status-legend">'+status('DRAFT')+status('PENDING')+status('REJECTED')+status('PUBLISH')+'<span>Hanya konten berstatus Sudah Terbit yang tampil ke jemaat.</span></div>';$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>'+esc(data.label)+'</h1><p>Perubahan disimpan sebagai draf, diperiksa, lalu tampil setelah disetujui.</p></div>'+(canAdd?'<button class="btn primary" data-new-record>'+icon('plus')+'Tambah '+esc(data.label)+'</button>':'')+'</div>'+legend+workflowHtml(data.workflows||[])+'<div class="toolbar"><label class="search">'+icon('search')+'<input id="entity-search" placeholder="Cari '+attr(data.label.toLowerCase())+'…" value="'+attr(state.search)+'"></label><div class="filters"><select id="entity-status"><option value="ALL" '+(state.status==='ALL'?'selected':'')+'>Semua status</option><option value="PUBLISH" '+(state.status==='PUBLISH'?'selected':'')+'>Sudah Terbit</option><option value="DRAFT" '+(state.status==='DRAFT'?'selected':'')+'>Draf</option></select><button class="icon-btn" data-reload title="Muat ulang">'+icon('refresh')+'</button></div></div><div class="record-grid">'+(records.length?records.map(recordHtml).join(''):emptyHtml('Belum ada konten yang sesuai.'))+'</div>'}
    function recordHtml(record){const isSchedule=state.entity==='schedule',isSetting=state.entity==='settings';const values=isSchedule?(record.fields||{}):(record.values||{});const pieces=Object.keys(values).map(k=>values[k]).filter(value=>value&&typeof value!=='object');const summary=isSchedule?[record.dateLabel,record.time?record.time+' WITA':''].concat(pieces.slice(0,3)).filter(Boolean).join(' · '):isSetting?String(values.value||'Belum diisi.'):pieces.slice(1,4).join(' · ');const canDelete=state.boot.user.permissions.edit&&!isSetting;return '<article class="card record"><div class="record-top">'+status(record.status||(isSchedule?'PUBLISH':'DRAFT'))+'<span class="small faint">'+esc(record.group||record.sectionTitle||'')+'</span></div><h3>'+esc(record.title||'Tanpa judul')+'</h3><p class="record-summary">'+esc(summary||'Belum ada keterangan.')+'</p><div class="record-actions">'+(state.boot.user.permissions.edit?'<button class="btn" data-edit-record="'+attr(record.id)+'">'+icon('edit')+'Edit</button>'+(isSchedule?'<button class="btn soft" data-duplicate-schedule="'+attr(record.id)+'">'+icon('plus')+'Duplikat</button>':'')+(canDelete?'<button class="btn danger" data-delete-record="'+attr(record.id)+'">'+icon('trash')+'</button>':''):'')+'</div></article>'}
    function workflowGuide(active){const steps=[['DRAFT','1. Draft','Isi dan periksa'],['PENDING','2. Diajukan','Menunggu reviewer'],['REVIEW','3. Ditinjau','Setujui atau revisi'],['PUBLISH','4. Terbit','Tampil di website']];const rank={DRAFT:0,REJECTED:0,PENDING:1,REVIEW:2,APPROVED:3,PUBLISH:3};const current=rank[active]??0;return '<div class="workflow-guide">'+steps.map((step,index)=>'<div class="workflow-step '+(index===current?'active':index<current?'done':'')+'"><b>'+step[1]+'</b><span>'+step[2]+'</span></div>').join('')+'</div>'}
    function workflowHtml(items){if(!items.length)return'';return '<div class="workflow-strip">'+items.map(w=>{const canManage=w.ownerEmail===state.boot.user.email||state.boot.user.role==='SUPERADMIN';const canApprove=state.boot.user.permissions.approve;let actions='';if(w.state==='PENDING'){if(canApprove)actions+='<button class="btn primary" data-open-review="'+attr(w.id)+'">'+icon('check')+'Tinjau</button>';if(canManage)actions+='<button class="btn" data-cancel-workflow="'+attr(w.id)+'">Tarik kembali</button>';if(!actions)actions='<span class="small faint">Menunggu reviewer</span>'}else if(canManage){if(w.action==='DELETE')actions+='<button class="btn primary" data-resubmit-workflow="'+attr(w.id)+'">'+icon('send')+'Ajukan hapus lagi</button>';else actions+='<button class="btn" data-edit-workflow="'+attr(w.id)+'">'+icon('edit')+(w.state==='REJECTED'?'Perbaiki revisi':'Lanjutkan draft')+'</button>';actions+='<button class="icon-btn" data-delete-workflow="'+attr(w.id)+'" aria-label="Hapus draft">'+icon('trash')+'</button>'}else actions='<span class="small faint">Dikelola oleh '+esc(w.ownerName)+'</span>';return '<div class="workflow-item">'+status(w.state)+'<div class="workflow-copy"><strong>'+esc(friendlyEntity(w.entity))+' · '+esc(w.action==='DELETE'?'HAPUS':'UBAH / TAMBAH')+'</strong><span>'+esc(w.ownerName)+' · '+esc(w.updatedAt)+'</span>'+(w.note?'<span class="workflow-note">Catatan: '+esc(w.note)+'</span>':'')+'</div><div class="button-row">'+actions+'</div></div>'}).join('')+'</div>'}

    function openNewRecord(){if(state.entity==='schedule'){if(!state.entityData.sections||!state.entityData.sections.length)return toast('Struktur bagian jadwal belum ditemukan. Periksa judul dan baris Tanggal pada spreadsheet.');return openScheduleEditor(null)}openGenericEditor(null,null)}

    async function uploadImage(input){
      const files=Array.from(input.files||[]);if(!files.length)return;
      if(files.length>12)return toast('Maksimal 12 foto dalam satu unggahan.');
      if(files.some(file=>file.size>4*1024*1024))return toast('Setiap gambar maksimal 4 MB.');
      const target=input.dataset.imageTarget,append=input.dataset.imageMode==='append';
      const field=$('[name="'+CSS.escape(target)+'"]',$('#editor-form'));
      const uploaded=[];
      try{
        for(let index=0;index<files.length;index++){
          const file=files[index];toast('Mengunggah foto '+(index+1)+' dari '+files.length+'…');
          const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
          const result=await server('adminUploadImage',[{name:file.name,mimeType:file.type,base64:base64}],30000);
          if(result&&result.url)uploaded.push(result.url);
        }
        if(field&&uploaded.length){
          const existing=append?String(field.value||'').split(/\n+/).map(value=>value.trim()).filter(Boolean):[];
          field.value=existing.concat(uploaded).slice(0,12).join('\n');
          field.dispatchEvent(new Event('change',{bubbles:true}));
        }
        toast(uploaded.length+' foto berhasil ditambahkan.');
      }catch(error){toast(cleanError(error.message))}finally{input.value=''}
    }
