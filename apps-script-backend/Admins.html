<!doctype html>
<html lang="id" data-theme="light" data-build="GALILEA-ADMIN-BOOTSTRAP-35-8-0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#eef2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07120c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Portal Pengurus · GMAHK Galilea Balikpapan</title>
  <!-- responsive admin lock: iPhone, Android, tablet, dan desktop -->
  <style>
    :root {
      --bg: #f4f6f1;
      --bg-elevated: #fafbf7;
      --surface: #ffffff;
      --surface-2: #edf2eb;
      --surface-3: #e0e9de;
      --surface-glass: rgba(255,255,255,.88);
      --text: #122017;
      --soft: #4c5e53;
      --faint: #6f8075;
      --line: rgba(22,60,36,.13);
      --line-strong: rgba(22,60,36,.25);
      --brand: #265438;
      --brand-hover: #1b402a;
      --brand-2: #6f956c;
      --brand-soft: #dbe9da;
      --brand-glow: rgba(38,84,56,.16);
      --gold: #aa8447;
      --gold-soft: #f4ecd9;
      --danger: #a53c44;
      --danger-soft: #f9e6e8;
      --warning: #9a6d1e;
      --warning-soft: #f9f1df;
      --success: #2e6e44;
      --success-soft: #d8ecde;
      --info: #2b618a;
      --info-soft: #d8e9f5;
      --sidebar: 274px;
      --topbar: 72px;
      --radius-sm: 10px;
      --radius: 18px;
      --radius-lg: 26px;
      --shadow-sm: 0 4px 18px rgba(18,48,28,.06);
      --shadow: 0 18px 50px rgba(18,48,28,.11);
      --shadow-lg: 0 32px 90px rgba(18,48,28,.16);
      --ease: cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"] {
      --bg: #07120c;
      --bg-elevated: #0d1b12;
      --surface: #102116;
      --surface-2: #162c1e;
      --surface-3: #1d3927;
      --surface-glass: rgba(16,33,22,.88);
      --text: #f3f7f0;
      --soft: #c2cec3;
      --faint: #91a294;
      --line: rgba(195,228,203,.13);
      --line-strong: rgba(195,228,203,.25);
      --brand: #a0c79c;
      --brand-hover: #b8deb4;
      --brand-2: #769f72;
      --brand-soft: #173724;
      --brand-glow: rgba(160,199,156,.22);
      --gold: #dcc082;
      --gold-soft: #302613;
      --danger: #f28b90;
      --danger-soft: #331518;
      --warning: #edc270;
      --warning-soft: #30230e;
      --success: #88ce99;
      --success-soft: #12331c;
      --info: #85c2f0;
      --info-soft: #142a3a;
      --shadow-sm: 0 4px 20px rgba(0,0,0,.32);
      --shadow: 0 18px 60px rgba(0,0,0,.48);
      --shadow-lg: 0 36px 110px rgba(0,0,0,.65);
    }

    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    html{background:var(--bg);color-scheme:light;scroll-behavior:smooth}
    html[data-theme="dark"]{color-scheme:dark}
    body{
      min-width:320px;
      color:var(--text);
      background:radial-gradient(55rem 35rem at 0 -5%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 70%),radial-gradient(45rem 30rem at 100% 20%,color-mix(in srgb,var(--gold) 6%,transparent),transparent 75%),var(--bg);
      font:15px/1.55 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      letter-spacing:-.014em;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    button,input,select,textarea{font:inherit}
    button,a{color:inherit}
    button{cursor:pointer}
    a{text-decoration:none}
    img{display:block;max-width:100%}
    h1,h2,h3,h4,p{margin-top:0}
    h1,h2,h3,h4{line-height:1.1;letter-spacing:-.04em}
    h1{font-size:clamp(1.9rem,4vw,3.2rem)}
    h2{font-size:clamp(1.5rem,3vw,2.4rem)}
    h3{font-size:1.15rem}
    .muted{color:var(--soft)}
    .faint{color:var(--faint)}
    .small{font-size:.78rem}
    .icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    :focus-visible{outline:3px solid var(--brand-glow);outline-offset:2px}

    /* Layout Structure */
    .admin-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{
      position:fixed;inset:0 auto 0 0;z-index:70;width:var(--sidebar);
      display:flex;flex-direction:column;padding:16px 14px;
      border-right:1px solid var(--line);
      background:color-mix(in srgb,var(--surface) 96%,transparent);
      backdrop-filter:blur(24px);
    }
    .brand{display:flex;align-items:center;gap:12px;padding:8px 8px 18px;border-bottom:1px solid var(--line)}
    .theme-logo-pair{position:relative;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:0 0 auto;background:var(--surface)}
    .theme-logo-pair img{grid-area:1/1;width:100%;height:100%;object-fit:cover}
    .theme-logo-pair .logo-dark{display:none}
    [data-theme="dark"] .theme-logo-pair .logo-light{display:none}
    [data-theme="dark"] .theme-logo-pair .logo-dark{display:block}
    .brand strong{display:block;font-size:.88rem;letter-spacing:-.02em}
    .brand span{display:block;color:var(--faint);font-size:.65rem;margin-top:2px}
    .build-badge{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:.58rem;font-weight:800;color:var(--brand);background:var(--brand-soft);letter-spacing:.06em}

    .nav-scroll{min-height:0;overflow-y:auto;padding:8px 0 16px;scrollbar-width:thin}
    .nav-label{margin:16px 10px 6px;color:var(--faint);font-size:.62rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .nav-item{
      width:100%;min-height:42px;display:flex;align-items:center;gap:11px;padding:0 12px;
      border:0;border-radius:11px;color:var(--soft);background:transparent;
      text-align:left;font-size:.78rem;font-weight:720;transition:.2s var(--ease);
    }
    .nav-item:hover{color:var(--text);background:var(--surface-2);transform:translateX(2px)}
    .nav-item.active{color:#fff;background:linear-gradient(135deg,#1f482f,#4d7450);box-shadow:0 8px 24px var(--brand-glow)}
    [data-theme="dark"] .nav-item.active{color:#07140b;background:linear-gradient(135deg,#c7e3c1,#86b282)}
    .nav-item .count{margin-left:auto;min-width:22px;padding:2px 6px;border-radius:999px;color:inherit;background:rgba(255,255,255,.2);font-size:.64rem;text-align:center;font-weight:800}

    .sidebar-user{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
    .user-row{display:flex;align-items:center;gap:10px}
    .avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:#fff;background:linear-gradient(135deg,#265438,#6f956c);font-weight:850;font-size:.78rem}
    .sidebar-user strong{display:block;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sidebar-user span{display:block;color:var(--faint);font-size:.65rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Workspace */
    .workspace{min-width:0;grid-column:2}
    .topbar{
      position:sticky;top:0;z-index:45;height:var(--topbar);
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:0 clamp(18px,3.5vw,46px);
      border-bottom:1px solid var(--line);
      background:color-mix(in srgb,var(--bg) 88%,transparent);
      backdrop-filter:blur(20px);
    }
    .crumb strong{display:block;font-size:.9rem}
    .crumb span{display:block;color:var(--faint);font-size:.68rem}
    .top-actions{display:flex;align-items:center;gap:8px}
    .mobile-menu{display:none}
    .icon-btn{
      width:40px;height:40px;display:grid;place-items:center;
      border:1px solid var(--line);border-radius:11px;
      color:var(--soft);background:var(--surface);
      transition:.2s var(--ease);
    }
    .icon-btn:hover{color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .content{width:min(1380px,calc(100% - clamp(28px,5vw,76px)));margin:0 auto;padding:clamp(28px,4vw,56px) 0 80px}

    /* UI Components */
    .btn{
      min-height:43px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:9px 16px;border:1px solid var(--line);border-radius:11px;
      color:var(--text);background:var(--surface);font-size:.77rem;font-weight:760;
      transition:.2s var(--ease);
    }
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .btn.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,#235136,#5c835f);box-shadow:0 8px 22px var(--brand-glow)}
    [data-theme="dark"] .btn.primary{color:#07140b;background:linear-gradient(135deg,#cbe5c6,#86b283)}
    .btn.soft{color:var(--brand);border-color:transparent;background:var(--brand-soft)}
    .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line));background:var(--danger-soft)}
    .btn.danger:hover{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 18%,var(--surface))}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .button-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

    .card{
      position:relative;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--surface);box-shadow:var(--shadow-sm);transition:.25s var(--ease);
      overflow:hidden;
    }
    .card-pad{padding:clamp(20px,2.6vw,30px)}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;
      color:var(--brand);font-size:.65rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase;
    }
    .eyebrow:before{width:18px;height:2px;content:"";background:currentColor;border-radius:2px}

    /* Dashboard Specifics */
    .dashboard-hero{
      display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:24px;
      margin-bottom:20px;padding:clamp(28px,4.5vw,52px);border-radius:24px;
      color:#fff;background:radial-gradient(35rem 25rem at 92% 5%,rgba(205,232,198,.22),transparent 68%),linear-gradient(128deg,#05130b,#143924 60%,#466649);
      box-shadow:var(--shadow);position:relative;overflow:hidden;
    }
    .dashboard-hero>*{position:relative;z-index:1}
    .dashboard-hero h1{margin-bottom:12px;font-size:clamp(2.4rem,4.8vw,4.2rem);line-height:.92;letter-spacing:-.05em}
    .dashboard-hero p{max-width:680px;margin-bottom:20px;color:rgba(255,255,255,.82);font-size:.95rem;line-height:1.6}
    .hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
    .hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);font-size:.68rem;font-weight:780;color:#fff}
    .hero-meta{align-self:end;display:grid;gap:10px;padding:20px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(0,0,0,.22);backdrop-filter:blur(14px)}
    .hero-meta div{display:flex;justify-content:space-between;gap:16px;color:rgba(255,255,255,.75);font-size:.72rem}
    .hero-meta strong{color:#fff;text-align:right}

    /* Alert Strips */
    .action-alert{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      margin-bottom:18px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);
      background:var(--surface);font-size:.78rem;font-weight:680;
    }
    .action-alert.warning{border-color:color-mix(in srgb,var(--warning) 38%,var(--line));background:var(--warning-soft);color:var(--text)}
    .action-alert.info{border-color:color-mix(in srgb,var(--info) 38%,var(--line));background:var(--info-soft);color:var(--text)}
    .action-alert.success{border-color:color-mix(in srgb,var(--success) 38%,var(--line));background:var(--success-soft);color:var(--text)}
    .action-alert-copy{display:flex;align-items:center;gap:10px}
    .action-alert-copy .icon{color:var(--brand)}

    /* Pulse Card: Upcoming Sabbath Worship */
    .pulse-card{
      display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;
      margin-bottom:20px;padding:22px 26px;border:1px solid var(--line);border-radius:var(--radius);
      background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--surface-2) 65%,var(--surface)));
    }
    .pulse-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .pulse-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .pulse-item{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
    .pulse-item small{display:block;color:var(--faint);font-size:.62rem;font-weight:800;text-transform:uppercase}
    .pulse-item strong{display:block;margin-top:2px;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* KPI Metrics */
    .grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .metric{
      min-height:148px;display:flex;flex-direction:column;justify-content:space-between;
      padding:20px;border-radius:var(--radius);background:var(--surface);cursor:pointer;
    }
    .metric:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow)}
    .metric-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .metric-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--brand);background:var(--brand-soft)}
    .metric strong{display:block;font-size:clamp(1.9rem,3.4vw,2.8rem);letter-spacing:-.06em;line-height:.95}
    .metric span{display:block;color:var(--soft);font-size:.74rem;font-weight:650;margin-top:4px}
    .metric.has-alert{border-color:color-mix(in srgb,var(--warning) 45%,var(--line))}
    .metric.has-alert .metric-icon{color:var(--warning);background:var(--warning-soft)}

    /* Operations Hub Grid */
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:36px 0 16px}
    .section-head h2{margin-bottom:0;font-size:clamp(1.45rem,2.5vw,2.1rem)}
    .hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .hub-card{
      padding:22px;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--surface);transition:.25s var(--ease);text-align:left;display:flex;flex-direction:column;gap:12px;
    }
    .hub-card:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--shadow)}
    .hub-card .icon{color:var(--brand)}
    .hub-card strong{font-size:.96rem}
    .hub-card span{color:var(--soft);font-size:.73rem;line-height:1.5}

    /* Content & Table Views */
    .toolbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin-bottom:18px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);
    }
    .search{min-width:240px;flex:1;display:flex;align-items:center;gap:10px}
    .search input{width:100%;height:38px;border:0;outline:0;color:var(--text);background:transparent}
    .filter-tabs{display:flex;flex-wrap:wrap;gap:6px}
    .filter-tab{
      min-height:34px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;
      color:var(--soft);background:transparent;font-size:.72rem;font-weight:750;transition:.2s var(--ease);
    }
    .filter-tab:hover,.filter-tab.active{color:var(--text);background:var(--surface-2);border-color:var(--line-strong)}
    .filter-tab.active{color:var(--brand);background:var(--brand-soft);border-color:transparent}
    .view-toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .view-btn{width:36px;height:36px;display:grid;place-items:center;border:0;color:var(--soft);background:transparent}
    .view-btn.active{color:var(--brand);background:var(--brand-soft)}

    /* Record Cards */
    .record-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
    .record{padding:22px;display:flex;flex-direction:column;gap:10px;height:100%}
    .record-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .record h3{margin:8px 0 4px;font-size:1.12rem}
    .record-summary{color:var(--soft);font-size:.78rem;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
    .record-actions{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:6px}
    .record-actions .btn{flex:1;min-width:0;min-height:38px;padding:6px 10px;font-size:.74rem}

    /* Table View */
    .table-container{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
    .data-table{width:100%;border-collapse:collapse;font-size:.78rem;text-align:left}
    .data-table th{padding:12px 16px;color:var(--soft);font-size:.67rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);border-bottom:1px solid var(--line)}
    .data-table td{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:middle}
    .data-table tr:hover td{background:color-mix(in srgb,var(--brand-soft) 35%,transparent)}
    .data-table .col-actions{text-align:right}

    /* Status Badges */
    .status{
      display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 9px;
      border:1px solid var(--line);border-radius:999px;font-size:.62rem;font-weight:850;letter-spacing:.04em;
    }
    .status:before{width:6px;height:6px;border-radius:50%;content:"";background:var(--faint)}
    .status.publish:before,.status.approved:before{background:var(--success)}
    .status.publish,.status.approved{color:var(--success);background:var(--success-soft);border-color:transparent}
    .status.pending:before{background:var(--warning)}
    .status.pending{color:var(--warning);background:var(--warning-soft);border-color:transparent}
    .status.rejected:before{background:var(--danger)}
    .status.rejected{color:var(--danger);background:var(--danger-soft);border-color:transparent}
    .status.draft:before{background:var(--faint)}
    .status.draft{color:var(--soft);background:var(--surface-2)}
    .privacy-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:.62rem;font-weight:800;color:var(--brand);background:var(--brand-soft)}

    /* Workflow Strips */
    .workflow-strip{display:grid;gap:10px;margin-bottom:20px}
    .workflow-item{
      display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;
      padding:14px 18px;border:1px solid var(--line);border-radius:15px;background:var(--surface);
    }
    .workflow-copy strong{display:block;font-size:.85rem}
    .workflow-copy span{display:block;color:var(--faint);font-size:.68rem}
    .workflow-note{margin-top:6px;padding:8px 12px;border-left:3px solid var(--warning);border-radius:0 8px 8px 0;color:var(--soft)!important;background:var(--warning-soft);font-size:.72rem}

    /* Approval & Service Cards */
    .approval-list,.service-list,.user-list{display:grid;gap:12px}
    .approval-card,.service-card,.user-card{
      display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:22px;
    }
    .approval-meta,.service-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--faint);font-size:.7rem}
    .payload{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px 16px;margin-top:14px;padding:14px;border-radius:12px;background:var(--surface-2)}
    .payload small{display:block;color:var(--faint);font-size:.62rem;font-weight:800;text-transform:uppercase}
    .payload strong{display:block;margin-top:2px;font-size:.78rem}

    /* Dialog / Modal */
    dialog{
      width:min(740px,calc(100% - 24px));max-height:calc(100vh - 30px);
      padding:0;border:1px solid var(--line);border-radius:24px;color:var(--text);background:var(--surface);
      box-shadow:var(--shadow-lg);overflow:hidden;
    }
    dialog::backdrop{background:rgba(4,14,8,.68);backdrop-filter:blur(10px)}
    dialog>form{display:flex;flex-direction:column;max-height:calc(100vh - 30px)}
    .modal-head{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface);
    }
    .modal-body{flex:1 1 auto;overflow-y:auto;padding:clamp(20px,3vw,32px)}
    .modal-foot{
      display:flex;justify-content:flex-end;gap:8px;
      padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);
    }
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .field{display:grid;gap:6px}
    .field.full{grid-column:1/-1}
    .field label{color:var(--soft);font-size:.7rem;font-weight:780}
    input,select,textarea{
      width:100%;min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;
      color:var(--text);background:var(--surface);font-size:.82rem;
    }
    textarea{min-height:110px;resize:vertical}
    .help{color:var(--faint);font-size:.67rem}

    /* Schedule Editor Projector Simulator */
    .editor-projector{
      position:relative;aspect-ratio:16/9;display:grid;grid-template-columns:minmax(120px,.62fr) minmax(0,1.38fr);
      gap:12px;padding:16px;overflow:hidden;border-radius:14px;color:#fff;
      background:radial-gradient(circle at 90% 0,rgba(221,197,125,.18),transparent 30%),linear-gradient(135deg,#04150c,#164b30);
    }
    .editor-projector-title{display:flex;flex-direction:column;justify-content:flex-end;padding:14px;border-radius:11px;background:rgba(0,0,0,.26)}
    .editor-projector-title small{color:#dfc785;font-size:.56rem;font-weight:850;letter-spacing:.12em}
    .editor-projector-title strong{margin-top:6px;font-size:clamp(1.1rem,2.8vw,1.8rem);line-height:.95}
    .editor-projector-title span{margin-top:6px;color:rgba(255,255,255,.72);font-size:.65rem}
    .editor-projector-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0;padding:12px;border-radius:11px;background:rgba(0,0,0,.22)}
    .editor-projector-fields div{border-bottom:1px solid rgba(255,255,255,.12);padding:4px 0}
    .editor-projector-fields dt{color:#dfc785;font-size:.48rem;font-weight:850;text-transform:uppercase}
    .editor-projector-fields dd{margin:2px 0 0;font-size:.85rem;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Loader & Gate */
    .loader{
      position:fixed;inset:0;z-index:300;display:grid;place-items:center;
      color:#eff6ec;background:radial-gradient(circle at 50% 45%,#1f472f,#061009 68%);
      transition:.35s var(--ease);
    }
    .loader.hidden{opacity:0;visibility:hidden}
    .loader-mark{position:relative;width:96px;height:96px;margin:0 auto 16px;display:grid;place-items:center}
    .orbit{position:absolute;inset:0;border:1px solid rgba(210,235,205,.28);border-radius:50%;animation:spin 3s linear infinite}
    .orbit:after{position:absolute;left:50%;top:-4px;width:8px;height:8px;border-radius:50%;content:"";background:#d9c080;box-shadow:0 0 16px #d9c080}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader p{font-size:.82rem;font-weight:750;text-align:center;margin-bottom:4px}
    .loader-note{display:block;color:rgba(244,248,240,.55);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;text-align:center}

    .toast-zone{position:fixed;right:18px;bottom:18px;z-index:400;display:grid;gap:8px}
    .toast{padding:12px 18px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--surface);box-shadow:var(--shadow);animation:toast-in .25s var(--ease)}
    @keyframes toast-in{from{opacity:0;transform:translateY(8px)}}
    .empty{padding:48px 24px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--soft)}
    .empty .icon{width:32px;height:32px;margin:0 auto 12px;color:var(--brand)}

    /* Responsive Queries */
    @media(max-width:1080px){
      .dashboard-hero{grid-template-columns:1fr}
      .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .pulse-card{grid-template-columns:1fr}
    }
    @media(max-width:850px){
      .admin-shell{display:block}
      .workspace{grid-column:auto}
      .sidebar{transform:translateX(-105%);transition:.32s var(--ease)}
      .sidebar.open{transform:none}
      .mobile-menu{display:grid}
      .mobile-overlay{position:fixed;inset:0;z-index:65;background:rgba(3,10,5,.55);opacity:0;visibility:hidden;transition:.25s}
      .mobile-overlay.open{opacity:1;visibility:visible}
      .topbar{padding-inline:16px}
      .content{width:min(100% - 24px,760px);padding-top:24px}
      .approval-card,.service-card,.user-card{grid-template-columns:1fr}
      .approval-card>.button-row,.service-card>.button-row{justify-content:flex-start}
      .workflow-item{grid-template-columns:1fr}
    }
    @media(max-width:580px){
      .grid-4,.grid-3,.grid-2,.hub-grid,.form-grid,.pulse-grid{grid-template-columns:1fr}
      .toolbar{flex-direction:column;align-items:stretch}
      .toolbar .search{min-width:0;width:100%}
      .record-actions .btn{width:100%}
      .action-alert{flex-direction:column;align-items:flex-start}
      .action-alert .btn{width:100%}
      .modal-foot{flex-direction:column}
      .modal-foot .btn{width:100%}
      .toast-zone{left:12px;right:12px;bottom:12px}
      .toast{width:100%}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>

  <script>
  (function(){
    'use strict';
    const APP_URL = <?!= JSON.stringify(appUrl || '') ?>;
    const $ = (s, c) => (c || document).querySelector(s);
    const $$ = (s, c) => Array.from((c || document).querySelectorAll(s));
    const state = {
      boot: null, route: 'dashboard', entity: null, entityData: null,
      search: '', status: 'ALL', viewMode: 'cards',
      approvalStatus: 'PENDING', approvals: [], approvalCache: {},
      currentEdit: null, currentReview: null, reviewMode: '', currentService: null,
      users: [], services: [], activity: null, searchTimer: null, dashboardRequest: 0
    };

    const icon = name => '<svg class="icon"><use href="#i-' + name + '"/></svg>';
    const logoMark = className => '<span class="theme-logo-pair ' + attr(className || 'brand-logo') + '" role="img" aria-label="Logo GMAHK Galilea"><img class="logo-light" src="/assets/logo-galilea-light.webp" alt=""><img class="logo-dark" src="/assets/logo-galilea-dark.webp" alt=""></span>';
    const esc = value => String(value == null ? '' : value).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
    const attr = esc;

    function server(name, args, timeoutMs) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('Portal admin ini harus diakses melalui Google Apps Script terautentikasi.'));
          return;
        }
        let done = false;
        const timer = setTimeout(() => {
          if (!done) {
            done = true;
            reject(new Error('Server admin belum merespons. Silakan coba kembali.'));
          }
        }, Math.max(8000, Number(timeoutMs) || 24000));
        const finish = fn => value => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          fn(value);
        };
        const runner = google.script.run
          .withSuccessHandler(finish(resolve))
          .withFailureHandler(finish(error => reject(new Error(error && error.message ? error.message : String(error)))));
        runner[name].apply(runner, args || []);
      });
    }

    function toast(message) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      $('#toasts').append(el);
      setTimeout(() => el.remove(), 3800);
    }

    function setBusy(button, busy, label) {
      if (!button) return;
      button.disabled = busy;
      if (busy) {
        button.dataset.old = button.innerHTML;
        button.textContent = label || 'Memproses…';
      } else if (button.dataset.old) {
        button.innerHTML = button.dataset.old;
        delete button.dataset.old;
      }
    }

    function status(value) {
      const raw = String(value || 'DRAFT').toUpperCase();
      const key = raw.toLowerCase();
      const labels = {
        DRAFT: 'Draf',
        PENDING: 'Menunggu Tinjauan',
        REVIEW: 'Sedang Ditinjau',
        APPROVED: 'Sudah Disetujui',
        PUBLISH: 'Sudah Terbit',
        REJECTED: 'Perlu Revisi'
      };
      return '<span class="status ' + key + '" title="Status: ' + attr(labels[raw] || raw) + '">' + esc(labels[raw] || raw) + '</span>';
    }

    function friendlyEntity(key) {
      const item = (state.boot && state.boot.entities || []).find(e => e.key === key);
      return item ? item.label : key;
    }

    function initials(name) {
      return String(name || 'A').split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('galilea:admin-theme', theme);
      const button = $('#theme-toggle');
      if (button) button.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
    }

    function currentTheme() {
      return localStorage.getItem('galilea:admin-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    }

    function shell() {
      const user = state.boot.user;
      const d = state.boot.dashboard;
      const entityNav = state.boot.entities
        .filter(e => !['settings', 'schedule'].includes(e.key))
        .map(e => nav(e.key, e.icon || 'calendar', e.label))
        .join('');

      return '<div class="admin-shell">' +
        '<div class="mobile-overlay" id="overlay"></div>' +
        '<aside class="sidebar" id="sidebar">' +
          '<a class="brand" href="#dashboard">' +
            logoMark('brand-logo') +
            '<div>' +
              '<strong>Portal Pengurus</strong>' +
              '<span>GMAHK Galilea</span>' +
              '<span class="build-badge">V' + esc(state.boot.version) + '</span>' +
            '</div>' +
          '</a>' +
          '<div class="nav-scroll">' +
            '<div class="nav-label">Ringkasan</div>' +
            nav('dashboard', 'grid', 'Dashboard Utama') +
            '<div class="nav-label">Ibadah & Pelayanan</div>' +
            nav('schedule', 'calendar', 'Jadwal Pelayanan') +
            (user.permissions.edit ? nav('services', 'heart', 'Layanan Jemaat', d.serviceRequests) : '') +
            '<div class="nav-label">Kelola Konten</div>' +
            entityNav +
            nav('settings', 'settings', 'Identitas Website') +
            (user.permissions.approve ? '<div class="nav-label">Tata Kelola</div>' + nav('approvals', 'check', 'Persetujuan Warta', d.pendingApprovals) + nav('activity', 'clock', 'Jejak Aktivitas & Audit') : '') +
            (user.permissions.manageAdmins ? nav('users', 'shield', 'Pengelola Portal') : '') +
            (user.permissions.edit ? nav('system', 'settings', 'Sistem, Arsip & Cache') : '') +
          '</div>' +
          '<div class="sidebar-user">' +
            '<div class="user-row">' +
              '<span class="avatar">' + esc(initials(user.name)) + '</span>' +
              '<div>' +
                '<strong>' + esc(user.name) + '</strong>' +
                '<span>' + esc(user.role) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</aside>' +
        '<section class="workspace">' +
          '<header class="topbar">' +
            '<div class="button-row">' +
              '<button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Buka navigasi">' + icon('menu') + '</button>' +
              '<div class="crumb"><strong id="crumb-title">Dashboard Utama</strong><span>Pusat operasional dan pelayanan GMAHK Galilea</span></div>' +
            '</div>' +
            '<div class="top-actions">' +
              '<a class="btn soft" href="' + attr(state.boot.publicSite.publicUrl || 'https://gmahk-galilea.vercel.app/') + '" target="_blank" rel="noopener">' + icon('external') + '<span>Website Publik</span></a>' +
              '<button class="icon-btn" id="theme-toggle" aria-label="Ganti mode warna">' + icon(currentTheme() === 'dark' ? 'sun' : 'moon') + '</button>' +
            '</div>' +
          '</header>' +
          '<main class="content" id="content"></main>' +
        '</section>' +
      '</div>';
    }

    function nav(route, iconName, label, count) {
      const value = Math.max(0, Number(count) || 0);
      return '<button class="nav-item" data-route="' + attr(route) + '">' +
        icon(iconName) +
        '<span>' + esc(label) + '</span>' +
        '<span class="count" data-nav-count="' + attr(route) + '" ' + (value ? '' : 'hidden') + '>' + esc(value) + '</span>' +
      '</button>';
    }

    function closeSidebar() {
      $('#sidebar')?.classList.remove('open');
      $('#overlay')?.classList.remove('open');
    }

    function routeTitle() {
      if (state.route === 'dashboard') return 'Dashboard Utama';
      if (state.route === 'services') return 'Layanan Jemaat';
      if (state.route === 'approvals') return 'Persetujuan Warta & Konten';
      if (state.route === 'activity') return 'Jejak Aktivitas & Audit';
      if (state.route === 'users') return 'Pengelola Portal';
      if (state.route === 'system') return 'Sistem, Arsip & Cache';
      return friendlyEntity(state.route);
    }

    function navigate(route) {
      state.route = route;
      state.search = '';
      state.status = 'ALL';
      location.hash = route;
      $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.route === route));
      $('#crumb-title').textContent = routeTitle();
      closeSidebar();
      renderRoute();
    }

    async function renderRoute() {
      const box = $('#content');
      box.innerHTML = loadingCard('Menyiapkan ' + routeTitle());
      try {
        if (state.route === 'dashboard') return renderDashboard();
        if (state.route === 'services') return await loadServices();
        if (state.route === 'approvals') return await loadApprovals();
        if (state.route === 'activity') return await loadActivity();
        if (state.route === 'users') return await loadUsers();
        if (state.route === 'system') return renderSystem();
        return await loadEntity(state.route);
      } catch (error) {
        box.innerHTML = errorBox(error.message);
      }
    }

    function loadingCard(label) {
      return '<div class="empty"><div class="loader-mark" style="width:68px;height:68px"><span class="orbit"></span>' + logoMark('loader-advent') + '</div><strong>' + esc(label || 'Memuat') + '</strong><p class="muted small">Menyambungkan data terbaru dari spreadsheet…</p></div>';
    }

    function errorBox(message) {
      return '<div class="empty">' + icon('info') + '<h3>Bagian ini belum dapat dimuat</h3><p>' + esc(cleanError(message)) + '</p><button class="btn primary" data-retry>Coba Kembali</button></div>';
    }

    function cleanError(message) {
      return String(message || 'Terjadi gangguan.').replace(/^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/, '');
    }

    function renderDashboard() {
      const d = state.boot.dashboard;
      const u = state.boot.user;
      const canEdit = u.permissions.edit;
      const loading = Boolean(d.loading);
      const publicToday = String(state.boot.publicSite.publicUrl || 'https://gmahk-galilea.vercel.app/').replace(/#.*$/, '') + '#today';

      const heroActions = canEdit
        ? '<div class="button-row">' +
            '<button class="btn primary" data-route="worshipPlans">' + icon('plus') + 'Siapkan Susunan Ibadah</button>' +
            '<button class="btn" data-route="schedule">' + icon('calendar') + 'Jadwal Petugas</button>' +
            '<a class="btn soft" href="' + attr(publicToday) + '" target="_blank" rel="noopener">' + icon('external') + 'Mode Layar Proyektor</a>' +
          '</div>'
        : '';

      const pendingAlert = Number(d.pendingApprovals) > 0
        ? '<div class="action-alert warning"><div class="action-alert-copy">' + icon('bell') + '<span>Ada <strong>' + esc(d.pendingApprovals) + ' konten</strong> yang menunggu peninjauan dan persetujuan.</span></div><button class="btn primary" data-route="approvals">Tinjau Sekarang</button></div>'
        : '<div class="action-alert success"><div class="action-alert-copy">' + icon('check') + '<span>Seluruh warta dan konten jemaat telah terbit dan tersinkronisasi.</span></div><span class="small faint">Sinkronisasi 60s aktif</span></div>';

      const metricVal = v => loading ? '—' : (v == null ? '0' : v);

      $('#content').innerHTML =
        '<section class="dashboard-hero">' +
          '<div>' +
            '<div class="hero-badges">' +
              '<span class="hero-badge">' + icon('shield') + 'Peran: ' + esc(u.role) + '</span>' +
              '<span class="hero-badge">' + icon('clock') + 'Zona WITA</span>' +
            '</div>' +
            '<h1>Selamat datang, ' + esc(u.name) + '.</h1>' +
            '<p>' + (canEdit ? 'Kelola jadwal pelayanan, susunan liturgi ibadah, berita jemaat, dan tindak lanjut permohonan doa melalui satu portal sekretariat resmi.' : 'Akses baca aktif. Anda dapat memeriksa jadwal pelayanan, liturgi ibadah, dan arsip warta jemaat.') + '</p>' +
            heroActions +
          '</div>' +
          '<aside class="hero-meta">' +
            '<div><span>Status Akun</span><strong>AKTIF · ' + esc(u.role) + '</strong></div>' +
            '<div><span>Pembaruan Data</span><strong>' + esc(d.updatedAt) + '</strong></div>' +
            '<div><span>Lembar Jadwal</span><strong>' + esc(d.scheduleSheet) + '</strong></div>' +
            '<div><span>Koneksi Sistem</span><strong>' + esc(d.systemStatus) + '</strong></div>' +
          '</aside>' +
        '</section>' +
        pendingAlert +
        '<div class="grid-4" style="margin-bottom:24px">' +
          metric('check', metricVal(d.pendingApprovals), 'Menunggu Persetujuan', 'approvals', Number(d.pendingApprovals) > 0) +
          metric('edit', metricVal(d.myDrafts), 'Draft Milik Saya', 'worshipPlans', false) +
          metric('bell', metricVal(d.activeAnnouncements), 'Pengumuman Aktif', 'announcements', false) +
          metric('heart', metricVal(d.serviceRequests), 'Permohonan Jemaat', 'services', Number(d.serviceRequests) > 0) +
        '</div>' +
        '<div class="section-head"><div><span class="eyebrow">OPERASIONAL CEPAT</span><h2>Pusat Kerja Sekretariat</h2></div></div>' +
        '<div class="hub-grid">' +
          hub('worshipPlans', 'calendar', 'Susunan Ibadah Sabat', 'Atur tema, ayat firman, petugas, dan liturgi ibadah.') +
          hub('schedule', 'calendar', 'Jadwal Pelayanan Jemaat', 'Kelola petugas khotbah, sekolah sabat, dan kelompok.') +
          hub('themeSong', 'music', 'Lagu Tema & Lagu Sion', 'Atur nomor lagu tema triwulan dan lirik lagu peribadatan.') +
          hub('announcements', 'bell', 'Agenda & Pengumuman', 'Informasi penting jemaat yang tampil di web dan warta.') +
          hub('activities', 'image', 'Berita & Dokumentasi Jemaat', 'Dokumentasikan kegiatan ibadah, bakti sosial, dan pemuda.') +
          hub('services', 'heart', 'Layanan & Doa Jemaat', 'Tindak lanjuti permohonan doa, konseling, dan pastoral.') +
        '</div>';
    }

    function metric(iconName, value, label, route, hasAlert) {
      return '<article class="card metric ' + (hasAlert ? 'has-alert' : '') + '" data-route="' + attr(route) + '">' +
        '<div class="metric-head"><span class="metric-icon">' + icon(iconName) + '</span><span class="status ' + (hasAlert ? 'pending' : 'draft') + '">' + (hasAlert ? 'Perlu dicek' : 'Normal') + '</span></div>' +
        '<div><strong>' + esc(value) + '</strong><span>' + esc(label) + '</span></div>' +
      '</article>';
    }

    function hub(route, iconName, title, desc) {
      return '<button class="hub-card" data-route="' + attr(route) + '">' +
        icon(iconName) +
        '<strong>' + esc(title) + '</strong>' +
        '<span>' + esc(desc) + '</span>' +
      '</button>';
    }

    function syncApprovalBadge() {
      const badge = $('[data-nav-count="approvals"]');
      if (!badge || !state.boot) return;
      const value = Math.max(0, Number(state.boot.dashboard.pendingApprovals) || 0);
      badge.textContent = value;
      badge.hidden = !value;
    }

    async function loadDashboardSummary(showError) {
      if (!state.boot) return;
      const request = ++state.dashboardRequest;
      state.boot.dashboard.loading = true;
      state.boot.dashboard.error = '';
      if (state.route === 'dashboard') renderDashboard();
      try {
        const result = await server('adminGetDashboardSummary', [], 32000);
        if (request !== state.dashboardRequest) return;
        if (result && result.dashboard) {
          state.boot.dashboard = Object.assign({}, state.boot.dashboard, result.dashboard, {loading: false, error: ''});
        }
        if (result && result.publicSite) {
          state.boot.publicSite = Object.assign({}, state.boot.publicSite, result.publicSite);
        }
        syncApprovalBadge();
        if (state.route === 'dashboard') renderDashboard();
      } catch (error) {
        if (request !== state.dashboardRequest) return;
        state.boot.dashboard.loading = false;
        state.boot.dashboard.error = cleanError(error.message);
        if (state.route === 'dashboard') renderDashboard();
        if (showError) toast(state.boot.dashboard.error);
      }
    }

    async function loadActivity() {
      state.activity = await server('adminGetDashboardActivity', []);
      const audit = state.activity.audit || [];
      const health = state.activity.health || [];

      $('#content').innerHTML =
        '<div class="section-head" style="margin-top:0">' +
          '<div><span class="eyebrow">JEJAK SISTEM & AUDIT</span><h1>Audit & Aktivitas</h1><p>Riwayat tindakan pengelola dan status kesehatan koneksi data.</p></div>' +
          '<button class="btn" data-reload>' + icon('refresh') + 'Muat Ulang</button>' +
        '</div>' +
        '<div class="grid-2">' +
          '<section>' +
            '<h3 style="margin-bottom:14px">Aktivitas Terkini</h3>' +
            '<div class="approval-list">' + (audit.length ? audit.map(activityHtml).join('') : emptyHtml('Belum ada jejak aktivitas pengelola.')) + '</div>' +
          '</section>' +
          '<section>' +
            '<h3 style="margin-bottom:14px">Status Sumber Data</h3>' +
            '<div class="approval-list">' + (health.length ? health.map(item => '<article class="card card-pad" style="padding:16px;display:flex;justify-content:space-between;align-items:center"><div><strong>' + esc(item.source) + '</strong><span class="small faint" style="display:block">' + esc(item.note || 'Terkoneksi normal.') + '</span></div>' + status(item.status) + '</article>').join('') : emptyHtml('Pemeriksaan kesehatan sistem belum dijalankan.')) + '</div>' +
          '</section>' +
        '</div>';
    }

    function activityHtml(item) {
      return '<article class="card card-pad" style="padding:14px 18px">' +
        '<div style="display:flex;justify-content:space-between;gap:10px">' +
          '<div><strong>' + esc(item.name || item.email) + ' · ' + esc(item.action) + '</strong><span class="small faint" style="display:block">' + esc(friendlyEntity(item.entity)) + (item.detail ? ' · ' + esc(item.detail) : '') + '</span></div>' +
          '<time class="small faint">' + esc(item.time) + '</time>' +
        '</div>' +
      '</article>';
    }

    async function loadEntity(key) {
      state.entity = key;
      state.entityData = await server('adminListEntity', [key]);
      renderEntity();
    }

    function renderEntity() {
      const data = state.entityData;
      const canEdit = state.boot.user.permissions.edit;
      let records = data.records || [];
      const totalCount = records.length;

      const query = state.search.toLowerCase();
      if (query) records = records.filter(r => JSON.stringify(r).toLowerCase().includes(query));
      if (state.status !== 'ALL') records = records.filter(r => String(r.status).toUpperCase() === state.status);

      const canAdd = canEdit && data.entity !== 'settings';

      const filterBar = '<div class="filter-tabs">' +
        '<button class="filter-tab ' + (state.status === 'ALL' ? 'active' : '') + '" data-filter-status="ALL">Semua (' + totalCount + ')</button>' +
        '<button class="filter-tab ' + (state.status === 'PUBLISH' ? 'active' : '') + '" data-filter-status="PUBLISH">Sudah Terbit</button>' +
        '<button class="filter-tab ' + (state.status === 'DRAFT' ? 'active' : '') + '" data-filter-status="DRAFT">Draf</button>' +
      '</div>';

      const viewToggle = '<div class="view-toggle">' +
        '<button class="view-btn ' + (state.viewMode === 'cards' ? 'active' : '') + '" data-view="cards" title="Tampilan Kartu">' + icon('grid') + '</button>' +
        '<button class="view-btn ' + (state.viewMode === 'table' ? 'active' : '') + '" data-view="table" title="Tampilan Tabel">' + icon('table') + '</button>' +
      '</div>';

      const viewContent = state.viewMode === 'table'
        ? renderTableView(records)
        : '<div class="record-grid">' + (records.length ? records.map(recordHtml).join('') : emptyHtml('Belum ada konten pada kategori ini.')) + '</div>';

      $('#content').innerHTML =
        '<div class="section-head" style="margin-top:0">' +
          '<div>' +
            '<span class="eyebrow">KELOLA DATA WEBSITE</span>' +
            '<h1>' + esc(data.label) + '</h1>' +
            '<p>Perubahan disimpan sebagai draf, ditinjau pengurus, lalu terbit otomatis ke jemaat.</p>' +
          '</div>' +
          (canAdd ? '<button class="btn primary" data-new-record>' + icon('plus') + 'Tambah ' + esc(data.label) + '</button>' : '') +
        '</div>' +
        workflowHtml(data.workflows || []) +
        '<div class="toolbar">' +
          '<label class="search">' + icon('search') + '<input id="entity-search" placeholder="Cari ' + attr(data.label.toLowerCase()) + '…" value="' + attr(state.search) + '"></label>' +
          filterBar +
          viewToggle +
          '<button class="icon-btn" data-reload title="Muat ulang">' + icon('refresh') + '</button>' +
        '</div>' +
        viewContent;
    }

    function renderTableView(records) {
      if (!records.length) return emptyHtml('Belum ada konten pada filter ini.');
      const isSchedule = state.entity === 'schedule';
      const isSetting = state.entity === 'settings';

      const rows = records.map(record => {
        const values = isSchedule ? (record.fields || {}) : (record.values || {});
        const pieces = Object.keys(values).map(k => values[k]).filter(v => v && typeof v !== 'object');
        const summary = isSchedule
          ? [record.dateLabel, record.time ? record.time + ' WITA' : ''].concat(pieces.slice(0, 2)).filter(Boolean).join(' · ')
          : isSetting ? String(values.value || 'Belum diisi.') : pieces.slice(0, 2).join(' · ');

        const canDelete = state.boot.user.permissions.edit && !isSetting;

        return '<tr>' +
          '<td>' + status(record.status || (isSchedule ? 'PUBLISH' : 'DRAFT')) + '</td>' +
          '<td><strong>' + esc(record.title || 'Tanpa judul') + '</strong></td>' +
          '<td><span class="muted">' + esc(record.group || record.sectionTitle || summary) + '</span></td>' +
          '<td class="col-actions">' +
            (state.boot.user.permissions.edit
              ? '<div class="button-row" style="justify-content:flex-end">' +
                  '<button class="btn" data-edit-record="' + attr(record.id) + '">' + icon('edit') + 'Edit</button>' +
                  (isSchedule ? '<button class="btn soft" data-duplicate-schedule="' + attr(record.id) + '">' + icon('plus') + 'Duplikat</button>' : '') +
                  (canDelete ? '<button class="btn danger" data-delete-record="' + attr(record.id) + '">' + icon('trash') + '</button>' : '') +
                '</div>'
              : '') +
          '</td>' +
        '</tr>';
      }).join('');

      return '<div class="table-container"><table class="data-table"><thead><tr><th>Status</th><th>Judul / Konten</th><th>Keterangan</th><th class="col-actions">Tindakan</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function recordHtml(record) {
      const isSchedule = state.entity === 'schedule';
      const isSetting = state.entity === 'settings';
      const values = isSchedule ? (record.fields || {}) : (record.values || {});
      const pieces = Object.keys(values).map(k => values[k]).filter(v => v && typeof v !== 'object');
      const summary = isSchedule
        ? [record.dateLabel, record.time ? record.time + ' WITA' : ''].concat(pieces.slice(0, 3)).filter(Boolean).join(' · ')
        : isSetting ? String(values.value || 'Belum diisi.') : pieces.slice(1, 4).join(' · ');
      const canDelete = state.boot.user.permissions.edit && !isSetting;

      return '<article class="card record">' +
        '<div class="record-top">' +
          status(record.status || (isSchedule ? 'PUBLISH' : 'DRAFT')) +
          '<span class="small faint">' + esc(record.group || record.sectionTitle || '') + '</span>' +
        '</div>' +
        '<h3>' + esc(record.title || 'Tanpa judul') + '</h3>' +
        '<p class="record-summary">' + esc(summary || 'Belum ada keterangan.') + '</p>' +
        '<div class="record-actions">' +
          (state.boot.user.permissions.edit
            ? '<button class="btn" data-edit-record="' + attr(record.id) + '">' + icon('edit') + 'Edit</button>' +
              (isSchedule ? '<button class="btn soft" data-duplicate-schedule="' + attr(record.id) + '">' + icon('plus') + 'Duplikat</button>' : '') +
              (canDelete ? '<button class="btn danger" data-delete-record="' + attr(record.id) + '">' + icon('trash') + '</button>' : '')
            : '') +
        '</div>' +
      '</article>';
    }

    function workflowGuide(active) {
      const steps = [
        ['DRAFT', '1. Draf', 'Disiapkan pengelola'],
        ['PENDING', '2. Diajukan', 'Menunggu persetujuan'],
        ['REVIEW', '3. Ditinjau', 'Periksa atau revisi'],
        ['PUBLISH', '4. Terbit', 'Tampil di website']
      ];
      const rank = {DRAFT: 0, REJECTED: 0, PENDING: 1, REVIEW: 2, APPROVED: 3, PUBLISH: 3};
      const current = rank[active] ?? 0;
      return '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px">' +
        steps.map((step, idx) => '<div style="padding:10px;border-radius:10px;border:1px solid var(--line);background:' + (idx === current ? 'var(--brand-soft)' : 'var(--surface-2)') + ';color:' + (idx === current ? 'var(--brand)' : 'var(--soft)') + '"><b style="display:block;font-size:.7rem">' + step[1] + '</b><span class="small faint">' + step[2] + '</span></div>').join('') +
      '</div>';
    }

    function workflowHtml(items) {
      if (!items.length) return '';
      return '<div class="workflow-strip">' + items.map(w => {
        const canManage = w.ownerEmail === state.boot.user.email || state.boot.user.role === 'SUPERADMIN';
        const canApprove = state.boot.user.permissions.approve;
        let actions = '';
        if (w.state === 'PENDING') {
          if (canApprove) actions += '<button class="btn primary" data-open-review="' + attr(w.id) + '">' + icon('check') + 'Tinjau</button>';
          if (canManage) actions += '<button class="btn" data-cancel-workflow="' + attr(w.id) + '">Tarik Kembali</button>';
        } else if (canManage) {
          if (w.action === 'DELETE') actions += '<button class="btn primary" data-resubmit-workflow="' + attr(w.id) + '">' + icon('send') + 'Ajukan Hapus Ulang</button>';
          else actions += '<button class="btn" data-edit-workflow="' + attr(w.id) + '">' + icon('edit') + (w.state === 'REJECTED' ? 'Perbaiki Revisi' : 'Lanjutkan Draf') + '</button>';
          actions += '<button class="icon-btn" data-delete-workflow="' + attr(w.id) + '" aria-label="Hapus draf">' + icon('trash') + '</button>';
        }
        return '<div class="workflow-item">' +
          status(w.state) +
          '<div class="workflow-copy">' +
            '<strong>' + esc(friendlyEntity(w.entity)) + ' · ' + esc(w.action === 'DELETE' ? 'HAPUS KONTEN' : 'UBAH / TAMBAH') + '</strong>' +
            '<span>Diajukan oleh: ' + esc(w.ownerName) + ' · ' + esc(w.updatedAt) + '</span>' +
            (w.note ? '<div class="workflow-note">Catatan Peninjau: ' + esc(w.note) + '</div>' : '') +
          '</div>' +
          '<div class="button-row">' + actions + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function openNewRecord() {
      if (state.entity === 'schedule') {
        if (!state.entityData.sections || !state.entityData.sections.length) {
          return toast('Struktur jadwal belum ditemukan. Periksa spreadsheet.');
        }
        return openScheduleEditor(null);
      }
      openGenericEditor(null, null);
    }

    function openRecord(id) {
      const record = (state.entityData.records || []).find(r => r.id === id);
      if (state.entity === 'schedule') return openScheduleEditor(record);
      openGenericEditor(record, null);
    }

    function duplicateSchedule(id) {
      const record = (state.entityData.records || []).find(item => item.id === id);
      if (!record) return toast('Jadwal sumber tidak ditemukan.');
      const base = new Date(String(record.isoDate || '') + 'T12:00:00');
      const next = isNaN(base.getTime()) ? '' : new Date(base.getTime() + 7 * 86400000).toISOString().slice(0, 10);
      openScheduleEditor({values: {sectionId: record.sectionId, isoDate: next, fields: Object.assign({}, record.fields || {})}});
      state.currentEdit.entityId = '';
      $('#editor-title').textContent = 'Duplikat Jadwal Pelayanan';
      $('#editor-subtitle').textContent = 'Petugas disalin. Periksa tanggal dan nama sebelum menyimpan.';
      toast('Jadwal disalin ke pekan berikutnya.');
    }

    function openWorkflow(id) {
      const workflow = (state.entityData.workflows || []).find(w => w.id === id);
      if (!workflow) return;
      if (workflow.action === 'DELETE') return resubmitWorkflow(id);
      if (state.entity === 'schedule') return openScheduleEditor({id: workflow.entityId, values: workflow.payload}, workflow);
      openGenericEditor({id: workflow.entityId, values: workflow.payload, title: 'Draft'}, workflow);
    }

    function openGenericEditor(record, workflow) {
      const data = state.entityData;
      state.currentEdit = {
        entity: data.entity,
        entityId: record && record.id || '',
        workflowId: workflow && workflow.id || '',
        action: workflow && workflow.action || 'UPSERT'
      };
      $('#editor-title').textContent = (record ? 'Edit ' : 'Tambah ') + data.label;
      $('#editor-subtitle').textContent = workflow
        ? (workflow.state === 'REJECTED' ? 'Perbaiki catatan peninjau lalu ajukan kembali.' : 'Lanjutkan draf sebelum diajukan.')
        : 'Perubahan baru akan masuk ke alur persetujuan pengurus.';
      $('#editor-workflow').innerHTML = workflowGuide(workflow && workflow.state || 'DRAFT');
      $('#editor-fields').innerHTML = data.fields.map(field => fieldHtml(field, record && record.values ? record.values[field.key] : '')).join('');
      $('#editor-preview').classList.remove('show');
      $('#editor-preview').innerHTML = '';
      $('#editor-dialog').showModal();
    }

    function editorSnapshot() {
      const form = $('#editor-form');
      const values = Object.fromEntries(new FormData(form).entries());
      if (state.currentEdit && state.currentEdit.entity === 'schedule') {
        const fields = {};
        Object.keys(values).filter(key => key.startsWith('schedule:')).forEach(key => fields[key.slice(9)] = values[key]);
        return {Jenis: values.sectionId || '', Tanggal: values.isoDate || '', ...fields};
      }
      const result = {};
      (state.entityData.fields || []).forEach(field => {
        const value = values[field.key];
        if (value) result[field.label] = value;
      });
      return result;
    }

    function previewEditor() {
      const box = $('#editor-preview');
      const snapshot = editorSnapshot();
      const entries = Object.entries(snapshot);

      let preview = '';
      if (state.currentEdit && state.currentEdit.entity === 'schedule') {
        const section = (state.entityData.sections || []).find(item => item.id === snapshot.Jenis);
        const label = section && section.title || snapshot.Jenis || 'Ibadah';
        const duties = entries.filter(item => !['Jenis', 'Tanggal'].includes(item[0]) && String(item[1] || '').trim());
        preview = '<article class="editor-projector" aria-label="Simulasi Proyektor 16:9">' +
          '<div class="editor-projector-title"><small>SIMULASI PROYEKTOR 16:9</small><strong>' + esc(label) + '</strong><span>' + esc(snapshot.Tanggal || 'Tanggal belum diisi') + '</span></div>' +
          '<dl class="editor-projector-fields">' + (duties.length ? duties.map(d => '<div><dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd></div>').join('') : '<div><dt>Petugas</dt><dd>Belum diisi</dd></div>') + '</dl>' +
        '</article>';
      } else {
        preview = '<article class="card card-pad"><h3>' + esc(snapshot['Judul'] || snapshot['Nama Kegiatan'] || state.entityData.label) + '</h3><div class="payload">' + entries.map(e => '<div><small>' + esc(e[0]) + '</small><strong>' + esc(e[1]) + '</strong></div>').join('') + '</div></article>';
      }

      box.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><strong style="font-size:.85rem">Pratinjau Hasil Sebelum Diajukan</strong>' + status('DRAFT') + '</div>' + preview;
      box.classList.add('show');
    }

    function fieldHtml(field, value) {
      const full = ['textarea', 'image', 'images', 'url'].includes(field.type) ? ' full' : '';
      let control;
      if (field.type === 'textarea') {
        control = '<textarea name="' + attr(field.key) + '" placeholder="' + attr(field.help || '') + '" ' + (field.required ? 'required' : '') + '>' + esc(value) + '</textarea>';
      } else if (field.type === 'images') {
        control = '<textarea name="' + attr(field.key) + '" rows="4" placeholder="Satu tautan URL foto per baris">' + esc(value) + '</textarea>' +
          '<div style="margin-top:8px"><label class="btn soft">' + icon('upload') + 'Unggah Banyak Foto<input class="image-file" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif" data-image-mode="append" data-image-target="' + attr(field.key) + '" hidden></label></div>';

    async function uploadImage(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      if (files.length > 12) return toast('Maksimal 12 foto dalam satu unggahan.');
      if (files.some(f => f.size > 4 * 1024 * 1024)) return toast('Setiap berkas foto maksimal 4 MB.');

      const target = input.dataset.imageTarget;
      const append = input.dataset.imageMode === 'append';
      const field = $('[name="' + CSS.escape(target) + '"]', $('#editor-form'));
      const uploaded = [];

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          toast('Mengunggah foto ' + (i + 1) + ' dari ' + files.length + '…');
          const base64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(String(r.result).split(',')[1]);
            r.onerror = rej;
            r.readAsDataURL(file);
          });
          const res = await server('adminUploadImage', [{name: file.name, mimeType: file.type, base64: base64}], 32000);
          if (res && res.url) uploaded.push(res.url);
        }
        if (field && uploaded.length) {
          const existing = append ? String(field.value || '').split(/\n+/).map(v => v.trim()).filter(Boolean) : [];
          field.value = existing.concat(uploaded).slice(0, 12).join('\n');
        }
        toast(uploaded.length + ' foto berhasil diunggah.');
      } catch (error) {
        toast(cleanError(error.message));
      } finally {
        input.value = '';
      }
    }

      if (!state.currentReview) return;
      const box = $('#review-reason-box');

      if (decision === 'REJECT' && state.reviewMode !== 'reject') {
        state.reviewMode = 'reject';
        box.style.display = 'block';

        return;
      }
      if (decision === 'REJECT' && note.length < 3) {
        toast('Tuliskan alasan revisi minimal 3 karakter.');
        return;
      }

      const button = $('[data-review="' + decision + '"]');
      setBusy(button, true);

    }

    function emptyHtml(msg) {
      return '<div class="empty">' + icon('info') + '<p>' + esc(msg) + '</p></div>';
    }

    function showGate(error) {
      const raw = String(error && error.message || 'Terjadi kendala saat membuka portal.');
      const access = /^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/.test(raw);
      const message = cleanError(raw);
      $('#loader').classList.add('hidden');
      $('#root').innerHTML =
        '<main style="min-height:100vh;display:grid;place-items:center;padding:24px">' +
          '<article class="card card-pad" style="width:min(640px,100%);text-align:center">' +
            logoMark('brand-logo') +
            '<h1 style="margin:16px 0 8px;font-size:clamp(1.8rem,4vw,2.6rem)">' + (access ? 'Akses Pengurus Diperlukan' : 'Portal Belum Tersambung') + '</h1>' +
            '<p class="muted">' + esc(message) + '</p>' +
            '<div style="margin:24px 0;display:flex;justify-content:center;gap:12px">' +
              '<a class="btn primary" href="' + (APP_URL ? APP_URL + '?page=admin' : '/admin?open=1') + '">Buka Portal Resmi</a>' +
              '<a class="btn" href="https://gmahk-galilea.vercel.app/">Website Galilea</a>' +
            '</div>' +
          '</article>' +
        '</main>';
    }

    function bindShell() {
      $('#mobile-menu')?.addEventListener('click', () => {
        $('#sidebar').classList.toggle('open');
        $('#overlay').classList.toggle('open');
      });
      $('#overlay')?.addEventListener('click', closeSidebar);
      $('#theme-toggle')?.addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    }

    document.addEventListener('click', event => {
      const route = event.target.closest('[data-route]');
      if (route) return navigate(route.dataset.route);

      const close = event.target.closest('[data-close]');
      if (close) return $('#' + close.dataset.close).close();

      if (event.target.closest('[data-preview-editor]')) return previewEditor();
      if (event.target.closest('[data-new-record]')) return openNewRecord();

      const edit = event.target.closest('[data-edit-record]');
      if (edit) return openRecord(edit.dataset.editRecord);

      const duplicate = event.target.closest('[data-duplicate-schedule]');
      if (duplicate) return duplicateSchedule(duplicate.dataset.duplicateSchedule);

      const del = event.target.closest('[data-delete-record]');
      if (del) return requestDelete(del.dataset.deleteRecord);

      const ew = event.target.closest('[data-edit-workflow]');
      if (ew) return openWorkflow(ew.dataset.editWorkflow);

      const rw = event.target.closest('[data-resubmit-workflow]');
      if (rw) return resubmitWorkflow(rw.dataset.resubmitWorkflow);

      const cw = event.target.closest('[data-cancel-workflow]');
      if (cw) return cancelWorkflow(cw.dataset.cancelWorkflow);

      const dw = event.target.closest('[data-delete-workflow]');
      if (dw) {
        if (!confirm('Hapus draf ini secara permanen?')) return;
        return server('adminDeleteWorkflow', [dw.dataset.deleteWorkflow])
          .then(() => { toast('Draf dihapus.'); loadEntity(state.entity); })
          .catch(e => toast(cleanError(e.message)));
      }

      if (event.target.closest('[data-reload]') || event.target.closest('[data-retry]')) return renderRoute();

      const filterStatus = event.target.closest('[data-filter-status]');
      if (filterStatus) {
        state.status = filterStatus.dataset.filterStatus;
        return renderEntity();
      }

      const viewBtn = event.target.closest('[data-view]');
      if (viewBtn) {
        state.viewMode = viewBtn.dataset.view;
        return renderEntity();
      }

      const approvalTab = event.target.closest('[data-approval-status]');
      if (approvalTab) return loadApprovals(approvalTab.dataset.approvalStatus);

      const reviewBtn = event.target.closest('[data-open-review]');
      if (reviewBtn) return openReview(reviewBtn.dataset.openReview);

      const reviewAction = event.target.closest('[data-review]');
      if (reviewAction) return review(reviewAction.dataset.review);

      const delApp = event.target.closest('[data-delete-approval]');
      if (delApp) return deleteApproval(delApp.dataset.deleteApproval);

      const sFilter = event.target.closest('[data-service-filter]');
      if (sFilter) {
        state.status = sFilter.dataset.serviceFilter;
        return renderServices();
      }

      const svc = event.target.closest('[data-open-service]');
      if (svc) return openService(svc.dataset.openService);

      const delSvc = event.target.closest('[data-delete-service]');
      if (delSvc) return deleteService(delSvc.dataset.deleteService);

      if (event.target.closest('[data-new-user]')) return openUser('');
      const eu = event.target.closest('[data-edit-user]');
      if (eu) return openUser(eu.dataset.editUser);
      const du = event.target.closest('[data-delete-user]');
      if (du) return deleteUser(du.dataset.deleteUser);

      const sys = event.target.closest('[data-system]');
      if (sys) return runSystem(sys.dataset.system, sys);
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'entity-search') {
        clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(() => {
          state.search = event.target.value;
          renderEntity();
        }, 180);
      }
      if (event.target.id === 'service-search') {
        clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(() => {
          state.search = event.target.value;
          renderServices();
        }, 180);
      }
    });

    document.addEventListener('change', event => {
      if (event.target.matches('.image-file')) uploadImage(event.target);
      if (event.target.id === 'schedule-section') {
        const section = state.entityData.sections.find(s => s.id === event.target.value);
        $('#schedule-fields').innerHTML = scheduleFieldsHtml(section, {});
      }
    });

    $('#editor-form').addEventListener('submit', saveEditor);
    $('#user-form').addEventListener('submit', saveUser);
    $('#save-service').addEventListener('click', saveService);

    window.addEventListener('hashchange', () => {
      const r = location.hash.slice(1);
      if (r && r !== state.route) navigate(r);
    });

    async function boot() {
      applyTheme(currentTheme());
      try {
        state.boot = await server('adminGetBootstrap',[],30000);
        $('#root').innerHTML = shell();
        bindShell();
        const route = location.hash.slice(1) || 'dashboard';
        navigate(route);
        $('#loader').classList.add('hidden');
        loadDashboardSummary(false);
      } catch (error) {
        showGate(error);
      }
    }
    boot();
  })();
  </script>
</body>
</html>
