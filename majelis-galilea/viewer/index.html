<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Majelis Galilea Viewer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f1ee;color:#211a1c}header,main{width:min(1120px,calc(100% - 24px));margin:auto}header{margin-top:14px;padding:16px 20px;border-radius:22px;background:#251a1c;color:#fff;display:flex;justify-content:space-between}main{display:grid;gap:12px;margin-top:12px;margin-bottom:50px}.hero,.panel{padding:26px;border-radius:28px;background:#fff;border:1px solid #e7dfe0}.hero{background:linear-gradient(145deg,#4a0710,#7b1020);color:#fff}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.9;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{padding:14px;border:1px solid rgba(255,255,255,.15);border-radius:16px}.list article{padding:14px 0;border-bottom:1px solid #eee}.list strong,.list small{display:block}.list small{color:#887b7e}.setup{display:none}.setup.show{display:block}.setup input{width:100%;height:46px}.setup button{height:42px;margin-top:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><b>MAJELIS GALILEA</b><span>VIEWER ONLY</span></header><main><section id="setup" class="panel setup"><h2>Hubungkan data</h2><p>Masukkan URL Apps Script /exec.</p><input id="api"><button onclick="saveApi()">Simpan</button></section><section class="hero"><small>PUBLIC VIEW</small><h1>Keputusan yang bisa dilihat.</h1><p>Tanpa edit, tanpa data pribadi anggota, tanpa transaksi keuangan detail.</p><div class="stats"><div><b id="m">0</b><br>Rapat</div><div><b id="d">0</b><br>Keputusan</div><div><b id="p">0</b><br>Program</div><div><b id="f">0</b><br>Dokumen</div></div></section><section class="panel"><h2>Notulen Disetujui</h2><div id="meet" class="list"></div></section><section class="panel"><h2>Keputusan</h2><div id="dec" class="list"></div></section><section class="panel"><h2>Program</h2><div id="prog" class="list"></div></section><section class="panel"><h2>Dokumen Aktif</h2><div id="docs" class="list"></div></section></main><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let API=localStorage.getItem('mg_viewer_api')||new URLSearchParams(location.search).get('backend')||'';function saveApi(){API=$('api').value.trim();localStorage.setItem('mg_viewer_api',API);$('setup').classList.remove('show');load()}window.MG_VIEWER_CALLBACK=x=>{if(!x||!x.success)return;$('m').textContent=x.summary.meetings;$('d').textContent=x.summary.decisions;$('p').textContent=x.summary.programs;$('f').textContent=x.summary.documents;$('meet').innerHTML=x.meetings.map(a=>`<article><small>${esc(a.date)}</small><strong>${esc(a.title)}</strong></article>`).join('');$('dec').innerHTML=x.decisions.map(a=>`<article><small>${esc(a.number)}</small><strong>${esc(a.decision)}</strong></article>`).join('');$('prog').innerHTML=x.programs.map(a=>`<article><small>${esc(a.department)}</small><strong>${esc(a.name)}</strong></article>`).join('');$('docs').innerHTML=x.documents.map(a=>`<article><small>${esc(a.category)}</small><strong>${a.url?`<a href="${esc(a.url)}" target="_blank">${esc(a.title)}</a>`:esc(a.title)}</strong></article>`).join('')};function load(){if(!API){$('setup').classList.add('show');return}const s=document.createElement('script');s.src=API+(API.includes('?')?'&':'?')+'api=viewer&callback=MG_VIEWER_CALLBACK&year='+new Date().getFullYear()+'&_='+Date.now();s.onerror=()=>{$('setup').classList.add('show');$('api').value=API};document.body.appendChild(s)}load()</script></body></html>
